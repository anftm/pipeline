name: Build Independent PDF Assets

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Exact VoiceOfML dataset, or blank for all nine
        required: false
        default: ""
        type: string
      limit:
        description: PDFs in this deterministic checkpoint
        required: true
        default: "10"
        type: string
      checkpoint:
        description: Zero-based sorted queue checkpoint
        required: true
        default: "0"
        type: string
      dry_run:
        description: Build and validate locally without publishing
        required: false
        default: true
        type: boolean

concurrency:
  group: reader-assets-pdf
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qpdf poppler-utils webp
      - name: Build and publish PDF assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
          FORCE_SYNC: "true"
        run: |
          [[ "${{ inputs.limit }}" =~ ^[0-9]+$ ]] && ((10#${{ inputs.limit }} >= 1 && 10#${{ inputs.limit }} <= 100))
          [[ "${{ inputs.checkpoint }}" =~ ^[0-9]+$ ]]
          python scripts/fetch_and_parse.py
          args=(--repo "${{ inputs.repo }}" --limit "${{ inputs.limit }}" --checkpoint "${{ inputs.checkpoint }}")
          [[ "${{ inputs.dry_run }}" == "true" ]] && args+=(--dry-run)
          python scripts/pdf_assets.py "${args[@]}"
