name: Reader · Retire Exact Historical CHM EPUBs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RETIRE-972 to confirm only the reviewed historical EPUB list
        required: true
        type: string
      resume:
        description: Recover the same isolated CHM transaction after an interruption
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  wait_for_producers:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RETIRE-972'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Preserve and await existing producer work without mutation
        run: python -u -B scripts/chm_retirement_wait.py

  retire:
    needs: wait_for_producers
    if: needs.wait_for_producers.result == 'success' && github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RETIRE-972'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      PAGES_REPO: ${{ secrets.PAGES_REPO }}
      RESUME: ${{ inputs.resume }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Test exact scope, two-site handoff, isolation and recovery
        env:
          READER_GC_DURABLE_MAINTENANCE: 'false'
        run: python -B -m unittest tests.test_chm_retirement_wait tests.test_run_chm_epub_retirement tests.test_chm_epub_journal tests.test_chm_epub_publication_safety tests.test_chm_epub_withdrawal_preview tests.test_chm_epub_bundle_integrity tests.test_reader_bucket_store tests.test_reader_gc_cache tests.test_reader_gc_graph tests.test_reader_gc_fence tests.test_reader_gc_maintenance -q
      - name: Verify exact inventory and retire only after actual closure
        id: retirement
        # Reserve job time for restoration and artifact upload when possible;
        # interruption still requires checking the durable recovery journal.
        timeout-minutes: 300
        env:
          CHM_STAGE: initial
        run: python -u -B scripts/run_chm_epub_retirement.py
      - name: Restore producer isolation when the transaction is safe
        if: always() && steps.retirement.outcome != 'success'
        run: python -u -B scripts/reader_gc_maintenance.py restore --journal output/chm-epub-retirement/maintenance.json --expected-owner "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-epub-retirement
          path: output/chm-epub-retirement/*
          retention-days: 90
          if-no-files-found: warn

  continue_1:
    needs: retire
    if: needs.retire.result == 'success' && github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RETIRE-972'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      PAGES_REPO: ${{ secrets.PAGES_REPO }}
      CHM_STAGE: continue
      RESUME: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild actual graph and verify a bounded deletion stage
        # A timed-out continuation remains isolated for explicit recovery. The
        # reserved time permits an artifact upload when the runner allows it.
        timeout-minutes: 300
        run: python -u -B scripts/run_chm_epub_retirement.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-epub-retirement-${{ github.job }}
          path: output/chm-epub-retirement/*
          retention-days: 90
          if-no-files-found: warn

  continue_2:
    needs: continue_1
    if: needs.continue_1.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      PAGES_REPO: ${{ secrets.PAGES_REPO }}
      CHM_STAGE: continue
      RESUME: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild actual graph and verify a bounded deletion stage
        timeout-minutes: 300
        run: python -u -B scripts/run_chm_epub_retirement.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-epub-retirement-${{ github.job }}
          path: output/chm-epub-retirement/*
          retention-days: 90
          if-no-files-found: warn

  continue_3:
    needs: continue_2
    if: needs.continue_2.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      PAGES_REPO: ${{ secrets.PAGES_REPO }}
      CHM_STAGE: continue
      RESUME: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild actual graph and verify a bounded deletion stage
        timeout-minutes: 300
        run: python -u -B scripts/run_chm_epub_retirement.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-epub-retirement-${{ github.job }}
          path: output/chm-epub-retirement/*
          retention-days: 90
          if-no-files-found: warn

  continue_4:
    needs: continue_3
    if: needs.continue_3.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      PAGES_REPO: ${{ secrets.PAGES_REPO }}
      CHM_STAGE: continue
      RESUME: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild actual graph and verify a bounded deletion stage
        timeout-minutes: 300
        run: python -u -B scripts/run_chm_epub_retirement.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-epub-retirement-${{ github.job }}
          path: output/chm-epub-retirement/*
          retention-days: 90
          if-no-files-found: warn

  continue_remaining:
    needs: continue_4
    if: needs.continue_4.result == 'success'
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        batch: [5, 6, 7, 8, 9, 10, 11]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
      PAGES_REPO: ${{ secrets.PAGES_REPO }}
      CHM_STAGE: continue
      RESUME: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild actual graph and verify one bounded deletion stage
        timeout-minutes: 300
        run: python -u -B scripts/run_chm_epub_retirement.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-epub-retirement-batch-${{ matrix.batch }}
          path: output/chm-epub-retirement/*
          retention-days: 90
          if-no-files-found: warn

  restore_after_stages:
    needs: [retire, continue_1, continue_2, continue_3, continue_4, continue_remaining]
    if: always() && needs.continue_remaining.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Restore only a committed exact CHM transaction
        run: python -u -B scripts/run_chm_epub_retirement.py --restore-committed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-epub-retirement-final-restoration
          path: output/chm-epub-retirement/*
          retention-days: 90
          if-no-files-found: warn
