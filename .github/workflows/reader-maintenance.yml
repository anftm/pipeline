name: Automatic Reader Maintenance

on:
  schedule:
    - cron: '13 2 * * 1'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum objects to collect in this window; zero means all candidates
        required: true
        default: "0"
        type: string
      plan_only:
        description: Drain and plan without deleting anything
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-global-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 500
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify every producer credential before isolation
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
        run: python -u scripts/reader_gc_maintenance.py preflight --journal output/maintenance/preflight.json
      - name: Pause producers, collect and restore
        timeout-minutes: 450
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          LIMIT: ${{ inputs.limit || '0' }}
          PLAN_ONLY: ${{ inputs.plan_only || 'false' }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || exit 1
          args=(run --journal output/maintenance/journal.json --limit "$LIMIT")
          if [[ "$PLAN_ONLY" == "true" ]]; then args+=(--plan-only); fi
          python -u scripts/reader_gc_maintenance.py "${args[@]}"
      - name: Recover recorded producer state after an interrupted orchestration
        if: always()
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
        run: python -u scripts/reader_gc_maintenance.py restore --journal output/maintenance/journal.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-maintenance-journal
          path: output/maintenance/*.json
          retention-days: 90
          if-no-files-found: error
