name: CCRD · Four-Source Text Change Report

on:
  # The legacy two-source writer cannot safely replace the live four-source
  # generation. This entry is a diagnostic only, not an automatic publisher.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Compare one upstream snapshot to the active manifest
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/check_ccrd_four_source.py --output output/ccrd/four-source-check.json
      - uses: actions/upload-artifact@v7
        with:
          name: ccrd-four-source-check
          path: output/ccrd/four-source-check.json
          retention-days: 30
          if-no-files-found: error
