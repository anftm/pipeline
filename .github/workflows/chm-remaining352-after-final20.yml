name: Resume remaining exact CHM EPUBs
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RESUME-CHM-352 to finish the fixed inventory
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max
jobs:
  retire:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RESUME-CHM-352'
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/chm-remaining352-after-final20-inner.yml
    secrets: inherit
