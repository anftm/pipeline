name: Reader/桶 · Build v3 Reading Candidates
run-name: v3 build wave / ${{ github.event_name }}

# Heavy per-book builds stay outside reader-sidecar; promotion owns the writer.
on:
  workflow_dispatch:
    inputs:
      tasks:
        description: JSON list of {identity, attempt} charged by the serialized auto step
        type: string
        required: true

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-v3-build
  cancel-in-progress: false
  queue: max

jobs:
  build:
    if: github.repository == 'anftm/pipeline' && vars.READER_V3_AUTO_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # The resolver quota is shared by the account. Builds read through the
      # paced resolver; 3 keeps headroom for the serialized promote step.
      max-parallel: 3
      matrix:
        task: ${{ fromJSON(inputs.tasks) }}
    env:
      READER_V3_BUILD_PROTOCOL: central-reader-v3-candidate-build-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # DjVu and PDF candidates retain the primary; page rasters are OCR-only.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils poppler-data fonts-noto-cjk fonts-liberation djvulibre-bin
      - run: pip install -r scripts/requirements.txt
      - name: Verify direct document contracts
        run: python -m unittest tests.test_direct_document_policy
      - name: Build and stage one immutable candidate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          READER_DATASET_PRIMARY_ENABLED: ${{ vars.READER_DATASET_PRIMARY_ENABLED || 'false' }}
          TASK_JSON: ${{ toJSON(matrix.task) }}
        run: python scripts/publish_reader_v3.py build-task --resource-json "$TASK_JSON" --output output/v3/build.json

  promote:
    needs: build
    if: >-
      always() && !cancelled() && needs.build.result != 'cancelled' &&
      needs.build.result != 'skipped' && github.repository == 'anftm/pipeline' &&
      vars.READER_V3_AUTO_PAUSED != 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Promote staged candidates and plan the next wave under the writer lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f operation=auto -f apply=true
