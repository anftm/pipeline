name: BHA · Monitor Parsed Revisions

on:
  # The scheduled path compares all 32 trees and the consumer; it never writes
  # parsed branches or requests reindexing.
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      archive_id:
        description: One archive number (0-31), or all to compare the BHA consumer
        type: string
        default: '0'
        required: true

concurrency:
  group: update-bha-index
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compare parsed tree to recorded baseline
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BHA_REINDEX_TOKEN: ${{ secrets.BHA_REINDEX_TOKEN }}
          ARCHIVE_ID: ${{ github.event_name == 'schedule' && 'all' || inputs.archive_id }}
        run: |
          [[ "$ARCHIVE_ID" == 'all' || "$ARCHIVE_ID" =~ ^([0-9]|[12][0-9]|3[01])$ ]] || exit 1
          args=(--archive "$ARCHIVE_ID" --output output/bha/parsed-report.json)
          if [[ "$ARCHIVE_ID" == 'all' ]]; then
            args+=(--samples config/bha-consumer-samples.json)
          fi
          python3 scripts/check_bha_parsed_readonly.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: bha-parsed-report
          path: output/bha/parsed-report.json
          retention-days: 30
          if-no-files-found: error
