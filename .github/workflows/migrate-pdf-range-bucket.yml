name: Migrate PDF Range Bucket

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Upload, verify, and delete legacy Reader-Assets PDFs
        required: true
        default: false
        type: boolean
      limit:
        description: Maximum legacy PDFs handled in one run
        required: true
        default: "100"
        type: string
      checkpoint:
        description: Batch number for a previous report
        required: true
        default: "0"
        type: string

permissions:
  contents: read

concurrency:
  group: reader-assets
  cancel-in-progress: false
  queue: max

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt
      - name: Migrate verified PDF range objects
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: |
          [[ "${{ inputs.limit || '100' }}" =~ ^[0-9]+$ ]] && ((10#${{ inputs.limit || '100' }} >= 1 && 10#${{ inputs.limit || '100' }} <= 500)) || exit 1
          [[ "${{ inputs.checkpoint || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--limit "${{ inputs.limit || '100' }}" --checkpoint "${{ inputs.checkpoint || '0' }}")
          if [[ "${{ inputs.apply }}" == "true" ]]; then args+=(--apply); fi
          python scripts/migrate_pdf_range_bucket.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-range-migration-report
          path: output/pdf-range-migration/report.json
          if-no-files-found: ignore
