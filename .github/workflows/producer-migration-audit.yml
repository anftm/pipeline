name: Reader · Archive retired producer evidence

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type ARCHIVE-RETIRED-PRODUCER-EVIDENCE to store audit evidence only
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-global-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  archive:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'ARCHIVE-RETIRED-PRODUCER-EVIDENCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Test exact audit and failure handling
        run: >-
          python -B -m unittest tests.test_reader_producer_audit_runner tests.test_reader_producer_audit_store
          tests.test_reader_producer_audit_publish tests.test_reader_producer_migration_intent
          tests.test_reader_producer_scope_transition tests.test_reader_producer_transition_state
          tests.test_reader_retired_repository_receipts tests.test_reader_producer_writer_proofs -q
      - name: Archive immutable evidence only
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python -u -B scripts/reader_producer_audit_runner.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: producer-migration-audit
          path: output/producer-migration-audit/*.json
          retention-days: 90
          if-no-files-found: warn
