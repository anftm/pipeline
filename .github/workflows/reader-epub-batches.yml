name: Reader/桶 · Convert EPUB Batches Locally
run-name: EPUB local batches / shard ${{ inputs.shard }}

on:
  workflow_dispatch:
    inputs:
      shard:
        description: EPUB shard containing exact source candidates
        type: choice
        options: ["0", "1", "2", "3", "4", "5", "6", "7"]
        required: true
      start:
        description: Starting candidate offset
        type: number
        default: 0
        required: true
      max_batches:
        description: At most 12 groups of 3 candidates
        type: number
        default: 12
        required: true

permissions:
  contents: read

concurrency:
  group: reader-backlog-inspection
  cancel-in-progress: false
  queue: max

jobs:
  convert:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned Reader dependencies
        run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Verify disjoint selection and failure isolation
        run: python -B -m unittest -v tests.test_reader_epub_batches tests.test_reader_epub_plan tests.test_reader_epub_shadow
      - name: Convert disjoint batches without bucket writes
        id: convert
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD: ${{ inputs.shard }}
          START: ${{ inputs.start }}
          MAX_BATCHES: ${{ inputs.max_batches }}
        run: |
          set -euo pipefail
          [[ "$SHARD" =~ ^[0-7]$ && "$START" =~ ^[0-9]+$ && "$MAX_BATCHES" =~ ^[0-9]+$ ]] || exit 1
          python -B scripts/reader_epub_batches.py --shard "$SHARD" --start "$START" \
            --max-batches "$MAX_BATCHES" --output output/epub-batches --export output/export
      - name: Preserve generated chapters and exact metadata, not native EPUBs
        if: ${{ always() && hashFiles('output/export/epub-converted/results.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reader-epub-converted-shard-${{ inputs.shard }}-start-${{ inputs.start }}
          path: output/export/epub-converted/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Preserve failure receipts
        if: ${{ always() && hashFiles('output/epub-batches/results.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: reader-epub-batch-results-shard-${{ inputs.shard }}-start-${{ inputs.start }}
          path: |
            output/epub-batches/results.json
            output/epub-batches/plans.json
            output/epub-batches/*-failure.json
          if-no-files-found: error
          retention-days: 14
