name: BHA · Verify Reindex Access (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.3
      - name: Test read-only access check
        run: python -B -m unittest tests.test_bha_reindex_access -v
      - name: Verify BHA status authentication without triggering reindex
        env:
          BHA_REINDEX_TOKEN: ${{ secrets.BHA_REINDEX_TOKEN }}
        run: python -B scripts/check_bha_reindex_access.py
