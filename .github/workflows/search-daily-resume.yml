name: 搜索 · Resume Daily Publication
run-name: Resume search transaction / ${{ inputs.transaction }}

on:
  workflow_dispatch:
    inputs:
      transaction:
        description: Exact existing transaction ID; never starts a new publication
        required: true
        type: string
      generation:
        description: Exact candidate generation already bound in the journal
        required: true
        type: string
      expected_parent:
        description: Exact parent generation already bound in the journal
        required: true
        type: string
      pages_revision:
        description: Exact reviewed Pages revision for this transition
        required: true
        type: string
      space_revision:
        description: Exact reviewed Space revision for this transition
        required: true
        type: string
      reviewed_space_successor:
        description: Optional exact separately reviewed Space descendant; original Space revision remains bound
        type: string
        default: ''
      reviewed_space_paths:
        description: JSON array of exact reviewed Reader/test paths changed by the successor
        type: string
        default: '[]'
      known_writers_coordinated:
        description: Known writers remain coordinated; this declaration is not a global lock
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: daily-sync
  cancel-in-progress: false
  queue: max
jobs:
  resume:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Require exact current main and coordinated writers
        env:
          GH_TOKEN: ${{ github.token }}
          ENABLED: ${{ vars.SEARCH_AUTOMATION_ENABLED }}
          WRITERS: ${{ inputs.known_writers_coordinated }}
        run: |
          set -euo pipefail
          [[ "$ENABLED" == true && "$WRITERS" == true ]]
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/search-daily-resume.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt requests==2.32.5 PyYAML==6.0.3
      - name: Verify publication and recovery contracts
        run: python -B -m unittest -v tests.test_search_daily_publish tests.test_search_transition tests.test_search_finalize_transition
      - name: Resume only the existing exact transaction
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          TRANSACTION: ${{ inputs.transaction }}
          GENERATION: ${{ inputs.generation }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          PAGES_REVISION: ${{ inputs.pages_revision }}
          SPACE_REVISION: ${{ inputs.space_revision }}
          REVIEWED_SPACE_SUCCESSOR: ${{ inputs.reviewed_space_successor }}
          REVIEWED_SPACE_PATHS: ${{ inputs.reviewed_space_paths }}
        run: |
          set -euo pipefail
          args=(--resume-transaction "$TRANSACTION" --generation "$GENERATION"
                --expected-parent "$EXPECTED_PARENT" --pages-revision "$PAGES_REVISION"
                --space-revision "$SPACE_REVISION" --known-writers-coordinated --timeout-seconds 3600)
          if [[ -n "$REVIEWED_SPACE_SUCCESSOR" ]]; then
            args+=(--reviewed-space-successor "$REVIEWED_SPACE_SUCCESSOR")
            python - <<'PY' > "$RUNNER_TEMP/reviewed-space-paths"
          import json, os
          values = json.loads(os.environ['REVIEWED_SPACE_PATHS'])
          if not isinstance(values, list) or not values or any(not isinstance(v, str) or '\n' in v or '\r' in v for v in values):
              raise SystemExit('Exact reviewed path array required')
          print('\n'.join(values))
          PY
            while IFS= read -r path; do args+=(--reviewed-space-path "$path"); done < "$RUNNER_TEMP/reviewed-space-paths"
          else
            [[ "$REVIEWED_SPACE_PATHS" == '[]' ]]
          fi
          python -B scripts/search_daily_publish.py "${args[@]}"
