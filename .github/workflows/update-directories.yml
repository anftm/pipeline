name: Update HF Repository Directories

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Update generated directories
        run: python scripts/update_dirs.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
