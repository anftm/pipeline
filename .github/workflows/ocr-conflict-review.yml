name: OCR conflict review commands

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  review:
    if: github.event.issue.pull_request == null && contains(github.event.issue.body, '<!-- proofreading-ocr-conflict:') && (contains(github.event.comment.body, '/ocr-keep') || contains(github.event.comment.body, '/ocr-drop'))
    runs-on: ubuntu-latest
    concurrency:
      group: update-bha-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Apply OCR conflict decision
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRACKER_TOKEN: ${{ github.token }}
          PROOFREAD_REVIEW_ACTORS: ${{ vars.PROOFREAD_REVIEW_ACTORS }}
        run: python3 scripts/review_ocr_patch_conflicts.py
