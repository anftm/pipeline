name: 搜索 · Apply Pages Generation
run-name: Search Pages / ${{ inputs.mode }} / ${{ inputs.operation || inputs.expected_revision }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare promotion or pre-pointer rollback; failed apply recovery is limited to reviewed pre-deploy failures
        type: choice
        required: true
        options:
          - prepare
          - rollback-prepare
          - apply
          - reconcile
          - recover-failed-apply
          - abandon-unclaimed
          - recover-superseded
          - inspect-superseded
      successor_revision:
        description: Exact current Pages revision for superseded-apply recovery
        type: string
        required: false
      successor_run:
        description: Exact later successful Pages push run ID
        type: string
        required: false
      expected_revision:
        description: Exact Pages main revision, required for prepare
        type: string
        required: false
      operation:
        description: Exact persisted operation ID, required for apply/reconcile
        type: string
        required: false
      known_writers_coordinated:
        description: Known search and Pages writers are coordinated
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false
  queue: max

jobs:
  switch:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require exact current main before supersession recovery
        if: inputs.mode == 'recover-superseded' || inputs.mode == 'inspect-superseded'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/search-promotion-pages.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install -r scripts/requirements.txt requests==2.32.5 PyYAML==6.0.3
      - name: Exercise Pages transition and recovery contracts
        run: python -B -m unittest -v tests.test_search_pages_transition tests.test_search_pages_deploy
      - name: Perform exactly one Pages transition action
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          MODE: ${{ inputs.mode }}
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          OPERATION: ${{ inputs.operation }}
          SUCCESSOR_REVISION: ${{ inputs.successor_revision }}
          SUCCESSOR_RUN: ${{ inputs.successor_run }}
          WRITERS: ${{ inputs.known_writers_coordinated }}
        run: |
          set -euo pipefail
          [[ "$MODE" == inspect-superseded || "$WRITERS" == 'true' ]]
          case "$MODE" in
            prepare|rollback-prepare)
              [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ && -z "$OPERATION" ]]
              python -B scripts/search_pages_transition.py --mode "$MODE" --expected-revision "$EXPECTED_REVISION"
              ;;
            recover-superseded|inspect-superseded)
              [[ "$OPERATION" =~ ^[0-9a-f]{32}$ && "$SUCCESSOR_REVISION" =~ ^[0-9a-f]{40}$ && "$SUCCESSOR_RUN" =~ ^[1-9][0-9]*$ && -z "$EXPECTED_REVISION" ]]
              python -B scripts/search_pages_transition.py --mode "$MODE" --operation "$OPERATION" --successor-revision "$SUCCESSOR_REVISION" --successor-run "$SUCCESSOR_RUN"
              ;;
            apply|reconcile|recover-failed-apply|abandon-unclaimed)
              [[ "$OPERATION" =~ ^[0-9a-f]{32}$ && -z "$EXPECTED_REVISION" ]]
              python -B scripts/search_pages_transition.py --mode "$MODE" --operation "$OPERATION"
              ;;
            *) exit 1 ;;
          esac
