name: CCRD · GC Collect Retired Index and OCR Generations

on:
  schedule:
    # Retain independent legacy index maintenance; OCR is not collected on a
    # schedule while its consumer is being withdrawn.
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: "ocr: retired OCR releases; legacy-generations: old CCRD/CW indexes"
        type: choice
        options: [ocr, legacy-generations]
        default: ocr
      apply:
        description: Retire expired control roots and delete their data; false is a plan only
        type: boolean
        default: false
      keep_generations:
        description: Total generations to retain, including the current release
        type: string
        default: "2"
      limit:
        description: Maximum generations to expire in this run; zero means all
        type: string
        default: "0"
      include_staging:
        description: Also reclaim abandoned staging/ocr objects
        type: boolean
        default: false

permissions:
  contents: read

# The CCRD publisher uses the same lock. This run therefore starts only when
# no publication is active, and a queued publication waits for it to finish.
concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      READER_GC_CACHE: .cache/reader-gc/reads.sqlite3
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/reader-gc
          key: reader-gc-ccrd-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reader-gc-ccrd-v1-
      - name: Plan or collect retired index and OCR generations
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          SCOPE: ${{ github.event_name == 'schedule' && 'legacy-generations' || inputs.scope || 'ocr' }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          KEEP_GENERATIONS: ${{ inputs.keep_generations || '2' }}
          LIMIT: ${{ inputs.limit || '0' }}
          INCLUDE_STAGING: ${{ github.event_name == 'schedule' && github.event.schedule == '23 9 * * *' || inputs.include_staging || 'false' }}
        run: |
          [[ "$KEEP_GENERATIONS" =~ ^[1-9][0-9]*$ ]] || exit 1
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || exit 1
          if [[ "$SCOPE" == ocr ]]; then
            (( KEEP_GENERATIONS >= 2 )) || exit 1
          else
            (( KEEP_GENERATIONS >= 1 )) || exit 1
          fi
          args=(--scope "$SCOPE" --storage s3 --keep-generations "$KEEP_GENERATIONS" --limit "$LIMIT"
                --output output/gc/ccrd-ocr-gc.json)
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          if [[ "$INCLUDE_STAGING" == true ]]; then args+=(--include-staging); fi
          python -u scripts/reader_gc_ccrd.py "${args[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/reader-gc
          key: reader-gc-ccrd-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ccrd-ocr-gc
          path: output/gc/*.json
          retention-days: 30
          if-no-files-found: error
