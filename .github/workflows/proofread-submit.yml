name: 校对 · Submit Proofreading

on:
  workflow_dispatch:
    inputs:
      archive_id:
        description: Archive number, 0-31
        required: true
        type: string
      kind:
        description: proofread, ocr_patch, config, or parse
        required: true
        default: proofread
        type: string
      article_id:
        description: Article ID for ocr_patch
        required: false
        type: string
      publication_id:
        description: Publication ID for ocr_patch
        required: false
        type: string
      patch_json:
        description: JSON patch object for ocr_patch
        required: false
        type: string
      path:
        description: Path inside archivesN for config
        required: false
        type: string
      content:
        description: Complete config file content for config
        required: false
        type: string
      metadata_json:
        description: Structured metadata correction JSON for config
        required: false
        type: string
      title:
        description: Pull request title
        required: false
        default: Proofreading correction
        type: string
      description:
        description: Pull request description
        required: false
        type: string
  repository_dispatch:
    types: [submit-proofread]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: submit-proofread
  cancel-in-progress: false

jobs:
  submit:
    if: github.repository == 'anftm/pipeline' && vars.PROOFREAD_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Verify durable submission contracts
        run: python -B -m unittest -v tests.test_proofread_delivery tests.test_proofread_legacy_recovery_risks
      - name: Create proofreading pull request
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRACKER_TOKEN: ${{ github.token }}
          PROOFREAD_DELIVERY_ENABLED: ${{ vars.PROOFREAD_DELIVERY_ENABLED }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python -B -m scripts.proofread_delivery --output output/proofread-delivery.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: proofreading-delivery-result
          path: output/proofread-delivery.json
          if-no-files-found: warn
          retention-days: 30
