name: CHM terminal receipt and maintenance handoff
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RELEASE-CHM-MAINTENANCE after exact receipts complete
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max
jobs:
  release:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RELEASE-CHM-MAINTENANCE'
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/chm-terminal-release-inner.yml
    secrets: inherit
