name: Reader/桶 · Account PDF Render and OCR Worker
run-name: PDF ${{ inputs.stage || 'auto' }} / ${{ github.repository_owner }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "auto: recognize rendered pages, else render new PDFs; render/ocr: force one stage"
        type: choice
        options: [auto, render, ocr]
        default: auto
      limit:
        description: Maximum pending books in this account's lane
        type: string
        default: "20"
      retry_failed_only:
        description: Retry only books currently failed in the OCR registry
        type: boolean
        default: false
      retry_failed_render:
        description: Re-render books whose source previously failed (for example a corrupt DjVu)
        type: boolean
        default: false
      keys:
        description: "Pinned repo/path sources for a native-DjVu pilot ('|' separated); requires stage=render"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: pdf-account-worker
  cancel-in-progress: false
  queue: max

env:
  PDF_JXL_ENABLED: "false"
  PDF_OCR_LANG: auto
  PDF_OCR_BACKEND: rapidocr_onnxruntime

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      shard_ids: ${{ steps.plan.outputs.shard_ids }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      publisher: ${{ steps.plan.outputs.publisher }}
      stage: ${{ steps.plan.outputs.stage }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify that this account owns a configured lane
        env:
          WORKER_OWNER: ${{ github.repository_owner }}
        run: python scripts/pdf_worker_lanes.py --owner "$WORKER_OWNER"
      - run: pip install -r scripts/requirements.txt
      - name: Plan only this account's sources
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WORKER_OWNER: ${{ github.repository_owner }}
          STAGE: ${{ inputs.stage || 'auto' }}
          LIMIT: ${{ inputs.limit || '20' }}
          RETRY_FAILED_ONLY: ${{ inputs.retry_failed_only || 'false' }}
          RETRY_FAILED_RENDER: ${{ inputs.retry_failed_render || 'false' }}
          KEYS: ${{ inputs.keys || '' }}
          RENDER_FIRST: ${{ vars.PDF_RENDER_FIRST || 'false' }}
          # Native DjVu admission (default off; "pilot" uses the exact key list).
          PDF_DJVU_NATIVE: ${{ vars.PDF_DJVU_NATIVE || 'false' }}
          PDF_DJVU_NATIVE_KEYS: ${{ vars.PDF_DJVU_NATIVE_KEYS || '' }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && ((10#$LIMIT >= 1 && 10#$LIMIT <= 100)) || exit 1
          [[ "$STAGE" =~ ^(auto|render|ocr)$ ]] || exit 1
          # Native-DjVu rollout: keep the lane rendering instead of draining OCR.
          if [[ "$STAGE" == "auto" && "$RENDER_FIRST" == "true" ]]; then STAGE=render; fi
          lane=$(python scripts/pdf_worker_lanes.py --owner "$WORKER_OWNER")
          args=(--worker-owner "$WORKER_OWNER" --worker-lane "$lane" --limit "$LIMIT")
          if [[ -n "$KEYS" ]]; then
            [[ "$STAGE" == "render" ]] || { echo "keys requires stage=render"; exit 1; }
            args+=(--keys "$KEYS")
          fi
          if [[ "$STAGE" != render ]]; then
            ocr_args=("${args[@]}")
            if [[ "$RETRY_FAILED_ONLY" == "true" ]]; then ocr_args+=(--retry-failed-only); fi
            python scripts/pdf_ocr_stages.py plan-ocr "${ocr_args[@]}"
            resolved=ocr
          fi
          # auto: recognition first; render new PDFs only when nothing is waiting
          # for OCR, so the lane never idles while either queue has work.
          if [[ "$STAGE" == render || ( "$STAGE" == auto && "$(jq -r '.shard_count' output/pdf-ocr/queue.json)" == 0 ) ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends poppler-utils poppler-data fonts-noto-cjk fonts-liberation djvulibre-bin
            FORCE_SYNC=true python scripts/fetch_and_parse.py
            retry_args=()
            if [[ "$RETRY_FAILED_RENDER" == "true" ]]; then retry_args+=(--retry-failed); fi
            python scripts/pdf_ocr_stages.py plan-render --native-text-stream --target-render-seconds 6000 "${retry_args[@]}" "${args[@]}"
            resolved=render
          fi
          echo "stage=$resolved" >> "$GITHUB_OUTPUT"
          echo "shard_ids=$(jq -c '.shard_ids' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(jq -r '.shard_count' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
          echo "publisher=$(jq -r '.publisher_repository' pdf-worker-lanes.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: pdf-account-queue
          path: output/pdf-ocr/queue.json
          retention-days: 7
          if-no-files-found: error

  build:
    needs: plan
    if: needs.plan.outputs.shard_count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Converted-lane DjVu rollout runs ten shards in one account. The old
      # eight-account/four-shard fan-out exhausted the shared resolver/Xet
      # quotas; a single account at ten stays below that and keeps the serial
      # central publisher fed.
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shard_ids) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install render dependencies
        if: needs.plan.outputs.stage == 'render'
        run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils poppler-data fonts-noto-cjk fonts-liberation djvulibre-bin
      - name: Install OCR dependencies
        if: needs.plan.outputs.stage == 'ocr'
        run: pip install -r scripts/requirements.txt -r scripts/requirements-pdf-ocr.txt
      - uses: actions/download-artifact@v8
        with:
          name: pdf-account-queue
          path: output/pdf-ocr
      - name: Build immutable account-owned objects
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          STAGE: ${{ needs.plan.outputs.stage }}
          SHARD: ${{ matrix.shard }}
        run: python scripts/pdf_ocr_stages.py "$STAGE" --shard "$SHARD"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-account-results-${{ matrix.shard }}
          path: output/pdf-ocr/bundle/results-*.json
          retention-days: 7
          if-no-files-found: warn

  notify:
    needs: [plan, build]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      needs.plan.outputs.shard_count != '0' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Request serialized publication in the central repository
        env:
          GH_TOKEN: ${{ secrets.PDF_PUBLISH_TOKEN }}
          PUBLISHER: ${{ needs.plan.outputs.publisher }}
          WORKER_REPOSITORY: ${{ github.repository }}
          WORKER_RUN_ID: ${{ github.run_id }}
          STAGE: ${{ needs.plan.outputs.stage }}
        run: |
          gh workflow run pdf-account-publish.yml --repo "$PUBLISHER" --ref main \
            -f worker_repository="$WORKER_REPOSITORY" -f worker_run_id="$WORKER_RUN_ID" -f stage="$STAGE"
