name: Reader/桶 · GC Cross-Bucket Report

on:
  schedule:
    - cron: "13 4 * * *"
  workflow_dispatch:
    inputs:
      record_observations:
        description: Persist complete-graph first-seen orphan observations
        required: true
        default: false
        type: boolean
      grace_days:
        description: First-seen orphan grace period
        required: true
        default: "0"
        type: string
      skip_input_bucket:
        description: Inventory without input credentials (incomplete report)
        default: false
        type: boolean

concurrency:
  # A report-only inventory performs no mutation and must not hold up OCR or
  # v3 publication. Observation recording remains serialized with writers.
  group: ${{ inputs.record_observations == 'true' && 'reader-sidecar' || 'reader-gc-report' }}
  cancel-in-progress: false
  queue: max

jobs:
  gc:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      READER_GC_CACHE: .cache/reader-gc/reads.sqlite3
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: .cache/reader-gc
          key: reader-gc-reads-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reader-gc-reads-v1-
      - name: Read-only reference report for all Reader formats
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_NAMESPACE: vomebook
          HF_S3_INPUT_NAMESPACE: melsm
          HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
          HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
          SKIP_INPUT_BUCKET: ${{ inputs.skip_input_bucket || 'false' }}
          GRACE_DAYS: ${{ inputs.grace_days || '0' }}
          RECORD_OBSERVATIONS: ${{ inputs.record_observations || 'false' }}
        run: |
          [[ "$GRACE_DAYS" =~ ^[0-9]+$ ]] || exit 1
          # S3 reads avoid the Hub resolver pacing (0.3 s/read), which made a
          # full scan of ~75k roots and manifests exceed the job timeout.
          # Report-only scans run alongside writers, so a moving snapshot is an
          # expected incomplete report, not a failed check. Deletion still uses
          # the drained maintenance window and requires graph_complete=true.
          args=(--output output/gc/reader-gc-report.json --grace-days "$GRACE_DAYS"
                --storage s3 --workers 4 --max-rounds 40 --deadline-minutes 315
                --allow-incomplete)
          if [[ "$RECORD_OBSERVATIONS" == "true" ]]; then args+=(--record-observations); fi
          if [[ "$SKIP_INPUT_BUCKET" == "true" ]]; then args+=(--skip-input-bucket); fi
          python scripts/reader_gc_graph.py --snapshot-retries 1 "${args[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/reader-gc
          key: reader-gc-reads-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-gc-report
          path: output/gc/reader-gc-report.json
          retention-days: 30
          if-no-files-found: error
