name: Reader/桶 · Build Static PDF Streams
run-name: Static PDF ${{ inputs.apply == true && 'apply' || 'plan' }} (${{ inputs.extension || 'all' }})

on:
  # Resume with reviewed, bounded manual batches; scheduled unlimited writes
  # must not restart merely because this workflow is re-enabled.
  workflow_dispatch:
    inputs:
      extension:
        description: Static PDF format, or all
        required: true
        default: all
        type: choice
        options: [all, ppt, pptx, pps, wps, ps]
      limit:
        description: Maximum sources per extension; apply requires 1-10, plan allows 0 for all
        required: true
        default: "1"
        type: string
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean
      apply:
        description: Convert and publish static PDFs
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-static-pdf
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan pending static PDF workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTENSION: ${{ inputs.extension || 'all' }}
          LIMIT: ${{ inputs.limit || '1' }}
          APPLY: ${{ inputs.apply }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo 'limit must be non-negative' >&2; exit 1; }
          if [[ "$APPLY" == 'true' && ! "$LIMIT" =~ ^([1-9]|10)$ ]]; then
            echo 'apply requires 1-10 sources per extension' >&2; exit 1
          fi
          args=(--kind static-pdf --extension "$EXTENSION" --output output/static-pdf-matrix.json)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/static-pdf-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/static-pdf-plan.tgz output/search_data.json state/commits.json output/static-pdf-matrix.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-static-pdf-plan
          path: output/static-pdf-plan.tgz
          retention-days: 1

  stream:
    needs: plan
    if: >-
      inputs.apply == true &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Format indexes and processing roots must not race a full sidecar scan.
    # Each matrix job owns one writer slot; finalize takes the same lock later.
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice ghostscript poppler-utils fontconfig fonts-noto-cjk fonts-wqy-microhei
      - uses: actions/download-artifact@v8
        with:
          name: reader-static-pdf-plan
          path: output
      - run: tar -xzf output/static-pdf-plan.tgz
      - name: Convert and publish static PDF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTENSION: ${{ matrix.extension }}
          LIMIT: ${{ inputs.limit || '1' }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^([1-9]|10)$ ]] || { echo 'apply requires 1-10 sources per extension' >&2; exit 1; }
          args=(--extension "$EXTENSION" --limit "$LIMIT" --apply --strict)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_static_pdf_stream.py "${args[@]}"

  finalize:
    needs: [plan, stream]
    if: >-
      always() && needs.plan.result == 'success' &&
      inputs.apply == true && needs.stream.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
