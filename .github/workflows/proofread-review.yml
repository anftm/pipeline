name: Proofreading review commands

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  review:
    if: github.event.issue.pull_request == null && contains(github.event.issue.body, '<!-- proofreading-prs:') && (contains(github.event.comment.body, '/approve') || contains(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    concurrency:
      group: proofreading-review
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Apply review command
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRACKER_TOKEN: ${{ github.token }}
          PROOFREAD_REVIEW_ACTORS: ${{ vars.PROOFREAD_REVIEW_ACTORS }}
        run: python3 scripts/review_proofread.py
