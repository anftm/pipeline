name: 搜索 · Adopt Verified Generation
run-name: Adopt ${{ inputs.generation }} / ${{ inputs.apply && 'apply' || 'preview' }}

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Already staged generation loaded by both sites
        type: string
        required: true
      apply:
        description: Conditionally create the absent desired-generation pointer
        type: boolean
        default: false
      known_writers_stopped:
        description: Operator confirms known search pointer writers are coordinated
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-sync
  cancel-in-progress: false
  queue: max

jobs:
  adopt:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install -r scripts/requirements.txt
      - name: Exercise adoption and pointer contracts
        run: python -B -m unittest -v tests.test_search_adopt tests.test_search_publication_pointer
      - name: Verify both actual consumers and optionally adopt
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          GENERATION: ${{ inputs.generation }}
          APPLY: ${{ inputs.apply }}
          WRITERS: ${{ inputs.known_writers_stopped }}
        run: |
          set -euo pipefail
          [[ "$GENERATION" =~ ^[0-9a-f]{64}$ ]]
          args=(--generation "$GENERATION")
          if [[ "$APPLY" == 'true' ]]; then
            [[ "$WRITERS" == 'true' ]]
            args+=(--apply --known-writers-stopped)
          fi
          python -B scripts/search_adopt.py "${args[@]}"
