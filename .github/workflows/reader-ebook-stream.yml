name: Reader/桶 · Build Ebook Chapter Streams
run-name: Ebook chapters ${{ inputs.apply == true && 'apply' || 'plan' }} (${{ inputs.extension || 'all' }})

on:
  # Resume with reviewed, bounded manual batches; CHM remains separate.
  workflow_dispatch:
    inputs:
      extension:
        description: Ebook format, or all non-CHM formats
        required: true
        default: all
        type: choice
        options: [all, epub, mobi, azw3, fb2]
      limit:
        description: Maximum attempts per shard; apply requires 1-3, plan allows 0
        required: true
        default: "1"
        type: string
      max_source_bytes:
        description: Maximum source bytes; 0 means unlimited
        required: true
        default: "0"
        type: string
      workers:
        description: Parallel builders (1-4)
        required: true
        default: "1"
        type: string
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean
      apply:
        description: Convert and publish ebook chapter streams
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-ebooks
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: ${{ inputs.max_source_bytes != '' && inputs.max_source_bytes != '0' && 'false' || 'true' }}
        run: python scripts/fetch_and_parse.py
      - name: Plan pending ebook workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTENSION: ${{ inputs.extension || 'all' }}
          LIMIT: ${{ inputs.limit || '1' }}
          MAX_SOURCE_BYTES: ${{ inputs.max_source_bytes || '0' }}
          WORKERS: ${{ inputs.workers || '1' }}
          APPLY: ${{ inputs.apply }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ && "$MAX_SOURCE_BYTES" =~ ^[0-9]+$ && "$WORKERS" =~ ^[1-4]$ ]] || exit 1
          if [[ "$APPLY" == 'true' && ! "$LIMIT" =~ ^[1-3]$ ]]; then
            echo 'apply requires 1-3 attempts per shard' >&2; exit 1
          fi
          args=(--kind ebook --output output/ebook-matrix.json --verify-source-sha --report output/ebook-report.json)
          if [[ "$EXTENSION" == "all" ]]; then
            for extension in epub mobi azw3 fb2; do args+=(--extension "$extension"); done
          else
            args+=(--extension "$EXTENSION")
          fi
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/ebook-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/ebook-plan.tgz output/search_data.json state/commits.json output/ebook-matrix.json output/ebook-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-ebook-plan
          path: output/ebook-plan.tgz
          retention-days: 1

  ebook-stream:
    needs: plan
    if: >-
      inputs.apply == true &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Protect shard checkpoints and processing roots from a sidecar handoff.
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install Calibre for converted ebook formats
        if: matrix.extension != 'epub'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre
      - uses: actions/download-artifact@v8
        with:
          name: reader-ebook-plan
          path: output
      - run: tar -xzf output/ebook-plan.tgz
      - name: Build and publish ebook chapter streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          EXTENSION: ${{ matrix.extension }}
          SHARD: ${{ matrix.shard }}
          LIMIT: ${{ inputs.limit || '1' }}
          MAX_SOURCE_BYTES: ${{ inputs.max_source_bytes || '0' }}
          WORKERS: ${{ inputs.workers || '1' }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[1-3]$ && "$MAX_SOURCE_BYTES" =~ ^[0-9]+$ && "$WORKERS" =~ ^[1-4]$ && "$SHARD" =~ ^[0-7]$ ]] || exit 1
          args=(--extension "$EXTENSION" --limit "$LIMIT"
                --max-source-bytes "$MAX_SOURCE_BYTES" --workers "$WORKERS"
                --shard-count 8 --shard-index "$SHARD" --apply --strict)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_epub_chapters.py "${args[@]}"

  finalize:
    needs: [plan, ebook-stream]
    if: >-
      always() && needs.plan.result == 'success' &&
      inputs.apply == true && needs.ebook-stream.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Merge canonical ebook indexes
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
          EXTENSION: ${{ inputs.extension || 'all' }}
        run: |
          args=()
          if [[ "$EXTENSION" == "all" ]]; then
            for extension in epub mobi azw3 fb2; do args+=(--extension "$extension"); done
          else
            args+=(--extension "$EXTENSION")
          fi
          python scripts/finalize_ebook_indexes.py "${args[@]}"
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
