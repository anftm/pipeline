name: BHA · Inspect Archive Fork

on:
  # Report-only comparison for one archive. The old fork updater also deletes
  # resolved branches, so no scheduled or implicit mutation is enabled here.
  workflow_dispatch:
    inputs:
      archive_id:
        description: One archive number from 0 through 31
        type: string
        default: '0'
        required: true

permissions:
  contents: read

concurrency:
  group: maintain-archive-forks
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Compare existing managed branches without mutation
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          UPSTREAM_OWNER: banned-historical-archives
          MIRROR_OWNER: anftm
          ARCHIVE_ID: ${{ inputs.archive_id }}
        run: |
          [[ "$ARCHIVE_ID" =~ ^([0-9]|[12][0-9]|3[01])$ ]] || exit 1
          python3 scripts/fork_repositories.py --inspect "$ARCHIVE_ID" --output output/bha/fork-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: bha-fork-report
          path: output/bha/fork-report.json
          retention-days: 30
          if-no-files-found: error
