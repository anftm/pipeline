name: Update CCRD source text

on:
  workflow_dispatch:

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Update CCRD source TXT
        run: python scripts/update_ccrd_source_txt.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME || 'VoiceOfML' }}
