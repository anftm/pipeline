name: Reader/桶 · Build Ebook Chapter Streams
run-name: ${{ inputs.automation_id && format('reader-auto/{0}', inputs.automation_id) || format('Ebook chapters {0} ({1})', inputs.apply == true && 'apply' || 'plan', inputs.extension || 'all') }}

on:
  # Resume with reviewed, bounded manual batches; CHM remains separate.
  workflow_dispatch:
    inputs:
      automation_id:
        description: Optional controller correlation ID (32 lowercase hex characters)
        required: false
        default: ""
        type: string
      search_generation:
        description: Published search generation for the automatic batch (64 lowercase hex)
        required: false
        default: ""
        type: string
      expected_sha:
        description: Controller pipeline main commit (40 lowercase hex)
        required: false
        default: ""
        type: string
      defer_unify:
        description: Let the controller unify and verify after canonical indexes and sidecar finish
        required: false
        default: false
        type: boolean
      extension:
        description: Ebook format, or all non-CHM formats
        required: true
        default: all
        type: choice
        options: [all, epub, mobi, azw3, fb2]
      limit:
        description: Maximum attempts per shard; apply requires 1-3, plan allows 0
        required: true
        default: "1"
        type: string
      max_source_bytes:
        description: Maximum source bytes; 0 means unlimited
        required: true
        default: "0"
        type: string
      workers:
        description: Parallel builders (1-4)
        required: true
        default: "1"
        type: string
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean
      finalize_only:
        description: Finalize existing shard indexes without conversion (manual, current main, apply required)
        required: false
        default: false
        type: boolean
      apply:
        description: Convert and publish ebook chapter streams
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-ebooks
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: inputs.finalize_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - &automation-gate
        name: Validate automation and current main
        env:
          AUTOMATION_ID: ${{ inputs.automation_id }}
          AUTOMATION_ENABLED: ${{ vars.READER_FORMAT_AUTOMATION_ENABLED }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEFER_UNIFY: ${{ inputs.defer_unify }}
          FINALIZE_ONLY: ${{ inputs.finalize_only }}
          APPLY: ${{ inputs.apply }}
          EXTENSION: ${{ inputs.extension }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$FINALIZE_ONLY" == 'true' ]]; then
            [[ "$EVENT_NAME" == 'workflow_dispatch' && "$APPLY" == 'true' ]]
            [[ -z "$AUTOMATION_ID$SEARCH_GENERATION$EXPECTED_SHA" && "$DEFER_UNIFY" != 'true' ]]
            [[ "$EXTENSION" =~ ^(all|epub|mobi|azw3|fb2)$ ]]
          else
            if [[ -z "$AUTOMATION_ID$SEARCH_GENERATION$EXPECTED_SHA" && "$DEFER_UNIFY" != 'true' ]]; then exit 0; fi
            [[ "$SEARCH_GENERATION" =~ ^[0-9a-f]{64}$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$DEFER_UNIFY" == 'true' ]]
            [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
            [[ "$AUTOMATION_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'automation_id must be 32 lowercase hex characters' >&2; exit 1; }
            [[ "$AUTOMATION_ENABLED" == 'true' ]]
          fi
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/reader-ebook-stream.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          local_sha=$(git rev-parse HEAD)
          [[ "$local_sha" == "$GITHUB_SHA" ]]
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$remote_sha" == "$GITHUB_SHA" ]]
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: ${{ inputs.max_source_bytes != '' && inputs.max_source_bytes != '0' && 'false' || 'true' }}
        run: python scripts/fetch_and_parse.py
      - &source-guard
        name: Bind automatic batch to published search sources
        if: inputs.automation_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python scripts/reader_format_daily.py guard-source \
            --generation "$SEARCH_GENERATION" --expected-sha "$EXPECTED_SHA" \
            --revisions state/commits.json
      - name: Select actionable sources for automatic batch
        if: inputs.automation_id != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTENSION: ${{ inputs.extension }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
        run: |
          set -euo pipefail
          [[ -n "$EXTENSION" && "$EXTENSION" != 'all' ]]
          python scripts/reader_format_sources.py --extension "$EXTENSION" \
            --generation "$SEARCH_GENERATION" --search-data output/search_data.json \
            --revisions state/commits.json --output output/reader-actionable.json
          mv output/reader-actionable.json output/search_data.json
      - name: Plan pending ebook workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTENSION: ${{ inputs.extension || 'all' }}
          LIMIT: ${{ inputs.limit || '1' }}
          MAX_SOURCE_BYTES: ${{ inputs.max_source_bytes || '0' }}
          WORKERS: ${{ inputs.workers || '1' }}
          APPLY: ${{ inputs.apply }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ && "$MAX_SOURCE_BYTES" =~ ^[0-9]+$ && "$WORKERS" =~ ^[1-4]$ ]] || exit 1
          if [[ "$APPLY" == 'true' && ! "$LIMIT" =~ ^[1-3]$ ]]; then
            echo 'apply requires 1-3 attempts per shard' >&2; exit 1
          fi
          args=(--kind ebook --output output/ebook-matrix.json --verify-source-sha --report output/ebook-report.json)
          if [[ "$EXTENSION" == "all" ]]; then
            for extension in epub mobi azw3 fb2; do args+=(--extension "$extension"); done
          else
            args+=(--extension "$EXTENSION")
          fi
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/ebook-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/ebook-plan.tgz output/search_data.json state/commits.json output/ebook-matrix.json output/ebook-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-ebook-plan
          path: output/ebook-plan.tgz
          retention-days: 1

  ebook-stream:
    needs: plan
    if: >-
      inputs.finalize_only != true && inputs.apply == true &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Protect shard checkpoints and processing roots from a sidecar handoff.
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install Calibre for converted ebook formats
        if: matrix.extension != 'epub'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre
      - uses: actions/download-artifact@v8
        with:
          name: reader-ebook-plan
          path: output
      - run: tar -xzf output/ebook-plan.tgz
      - *automation-gate
      - *source-guard
      - name: Build and publish ebook chapter streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          EXTENSION: ${{ matrix.extension }}
          SHARD: ${{ matrix.shard }}
          LIMIT: ${{ inputs.limit || '1' }}
          MAX_SOURCE_BYTES: ${{ inputs.max_source_bytes || '0' }}
          WORKERS: ${{ inputs.workers || '1' }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[1-3]$ && "$MAX_SOURCE_BYTES" =~ ^[0-9]+$ && "$WORKERS" =~ ^[1-4]$ && "$SHARD" =~ ^[0-7]$ ]] || exit 1
          args=(--extension "$EXTENSION" --limit "$LIMIT"
                --max-source-bytes "$MAX_SOURCE_BYTES" --workers "$WORKERS"
                --shard-count 8 --shard-index "$SHARD" --apply --strict)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_epub_chapters.py "${args[@]}"

  finalize:
    needs: [plan, ebook-stream]
    if: >-
      always() && inputs.apply == true &&
      ((inputs.finalize_only == true && needs.plan.result == 'skipped' && needs.ebook-stream.result == 'skipped') ||
       (inputs.finalize_only != true && needs.plan.result == 'success' && needs.ebook-stream.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - *automation-gate
      - name: Merge canonical ebook indexes
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
          EXTENSION: ${{ inputs.extension || 'all' }}
        run: |
          args=()
          if [[ "$EXTENSION" == "all" ]]; then
            for extension in epub mobi azw3 fb2; do args+=(--extension "$extension"); done
          else
            args+=(--extension "$EXTENSION")
          fi
          python scripts/finalize_ebook_indexes.py "${args[@]}"
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        if: inputs.defer_unify != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
