name: Reader/桶 · Build Local EPUB Shadow
run-name: EPUB local shadow / shard ${{ inputs.shard }}

on:
  workflow_dispatch:
    inputs:
      shard:
        description: Exact EPUB content-change shard (0-7), at most three files
        type: choice
        options: ["0", "1", "2", "3", "4", "5", "6", "7"]
        required: true

permissions:
  contents: read

concurrency:
  group: reader-backlog-inspection
  cancel-in-progress: false
  queue: max

jobs:
  shadow:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Test bounded EPUB source and chapter verification
        run: python -B -m unittest -v tests.test_reader_format_backlog tests.test_reader_epub_plan tests.test_reader_epub_shadow
      - name: Build exact content changes locally without bucket writes
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          [[ "$SHARD" =~ ^[0-7]$ ]] || exit 1
          python -B scripts/reader_epub_shadow.py --shard "$SHARD" --output output/epub-shadow
      - name: Preserve only verification report
        uses: actions/upload-artifact@v7
        with:
          name: reader-epub-shadow-report
          path: output/epub-shadow/report.json
          if-no-files-found: error
          retention-days: 14
