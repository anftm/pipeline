name: Reader/桶 · Publish v3 Reading Generation
run-name: v3 ${{ inputs.operation || github.event_name }} / ${{ (inputs.apply || github.event_name != 'workflow_dispatch') && 'apply' || 'verify' }}

on:
  schedule:
    - cron: '43 */2 * * *'
    # Daily journal of newly releasable OCR inputs; reader-gc-collect deletes them.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [build-stage, stage, promote, rollback, withdraw, ack, inspect, auto, correct, accept, reject, retry, retire, retire-ocr-progress, unify, repair-gbk]
        default: inspect
      resource_json:
        description: Pinned build-stage spec or qualified reading/candidate/rollback resource JSON
        type: string
        default: '{}'
      expected_parent:
        description: Expected current v3 generation, or none for initial promotion
        type: string
        default: none
      surface:
        type: choice
        options: [hf, pages]
        default: hf
      apply:
        description: Apply after complete validation under the central writer lock
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-sidecar
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.repository == 'anftm/pipeline' &&
      (vars.READER_V3_AUTO_PAUSED != 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation != 'auto'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      READER_V3_WRITE_PROTOCOL: central-reader-sidecar-v3-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Verify and execute the central v3 operation
        id: operation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          READER_V3_PREVIEW_FIRST: ${{ vars.READER_V3_PREVIEW_FIRST || 'false' }}
          READER_V3_DJVU_MIGRATION: ${{ vars.READER_V3_DJVU_MIGRATION || 'false' }}
          OCR_CORRECTION_API_BASE: ${{ secrets.OCR_CORRECTION_API_BASE }}
          OCR_CORRECTION_API_KEY: ${{ secrets.OCR_CORRECTION_API_KEY }}
          OPERATION: ${{ inputs.operation }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          SURFACE: ${{ inputs.surface }}
          APPLY: ${{ inputs.apply }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            # Scheduled runs only admit complete OCR into v3. Model correction is
            # suspended from automation and runs only by explicit dispatch.
            OPERATION=auto
            APPLY=true
            if [[ "$SCHEDULE" == '23 5 * * *' ]]; then OPERATION=retire; fi
          fi
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          if [[ -z "$RESOURCE_JSON" ]]; then RESOURCE_JSON='{}'; fi
          args=("$OPERATION" --output output/v3/publication.json)
          case "$OPERATION" in
            build-stage|stage|promote|rollback|withdraw) args+=(--resource-json "$RESOURCE_JSON" --expected-parent "$EXPECTED_PARENT") ;;
            auto|correct|accept|reject|retry|repair-gbk|unify) args+=(--resource-json "$RESOURCE_JSON") ;;
            retire|retire-ocr-progress) ;;
            ack) args+=(--surface "$SURFACE") ;;
            inspect) ;;
            *) exit 1 ;;
          esac
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python scripts/publish_reader_v3.py "${args[@]}"
          changed=true
          if [[ "$OPERATION" == auto ]]; then
            changed=$(jq -r 'if has("changed") then .changed else (.processed | length > 0) end' output/v3/publication.json)
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Dispatch the next parallel build wave outside the writer lock
        if: steps.operation.outputs.apply == 'true' && steps.operation.outputs.operation == 'auto' && vars.READER_V3_AUTO_PAUSED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wave=$(jq -c '.wave // []' output/v3/publication.json)
          if [[ "$wave" != "[]" ]]; then
            gh workflow run reader-v3-build.yml --repo "$GITHUB_REPOSITORY" --ref main -f tasks="$wave"
          fi
      - name: Publish the pinned projection to Pages
        if: >-
          steps.operation.outputs.apply == 'true' &&
          (steps.operation.outputs.operation == 'auto' ||
           (steps.operation.outputs.changed == 'true' && contains(fromJSON('["correct","accept","promote","rollback","withdraw","repair-gbk","unify"]'), steps.operation.outputs.operation)))
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
        run: python scripts/publish_search_reader_index.py
      - name: Confirm both deployed consumer projections
        id: ack
        if: >-
          steps.operation.outputs.apply == 'true' &&
          (
            steps.operation.outputs.operation == 'auto' ||
            (steps.operation.outputs.changed == 'true' && contains(fromJSON('["auto","correct","accept","promote","rollback","withdraw","repair-gbk","unify"]'), steps.operation.outputs.operation))
          )
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
        run: |
          python scripts/publish_reader_v3.py ack-all --apply --output output/v3/consumers.json
          echo "complete=$(jq -r '.complete // false' output/v3/consumers.json)" >> "$GITHUB_OUTPUT"
          # Record the base-catalog generation both deployments just confirmed.
          # The GC collector needs this to compact history; it never relied on
          # acknowledgments inside the 2 GB canonical catalog itself.
          if [[ "$(jq -r '.complete // false' output/v3/consumers.json)" == "true" ]]; then
            python scripts/publish_reader_v3.py acknowledge-legacy --apply \
              --output output/v3/acknowledgments.json
            ack_reason=$(jq -r '.reason // "recorded"' output/v3/acknowledgments.json)
            if [[ "$ack_reason" == "recorded" ]]; then
              # Shrink the base catalog in the ordinary publish path. The 2 GB
              # object would otherwise need a drained window just to stay bounded.
              python scripts/publish_reader_v3.py compact-legacy --apply \
                --output output/v3/catalog-compaction.json
              # The compaction rewrites the catalog, so refresh the receipt that
              # names its digest for the GC collector.
              python scripts/publish_reader_v3.py acknowledge-legacy --apply \
                --output output/v3/acknowledgments.json
            else
              echo "base acknowledgment deferred: $ack_reason"
            fi
          else
            echo "consumer projections are incomplete; base acknowledgment deferred"
          fi
      # Full history/input retirement is manual operation=retire. Do not scan
      # every retained OCR book while holding the ordinary publication lock.
      - name: Write deduplicated PDF/OCR progress report
        if: >-
          always() && steps.operation.outputs.operation != 'unify' &&
          steps.operation.outputs.operation != 'inspect' && steps.operation.outputs.operation != 'ack'
        timeout-minutes: 10
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pdf_progress_report.py --record --output output/v3/pdf-progress.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-publication-report
          path: output/v3/*.json
          retention-days: 30
          if-no-files-found: warn
