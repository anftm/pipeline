name: Reader/桶 · Publish v3 Reading Generation
run-name: v3 ${{ inputs.operation || github.event_name }} / ${{ (inputs.apply || github.event_name != 'workflow_dispatch') && 'apply' || 'verify' }}

on:
  # Retirement is an explicit operation: restoring the publisher must not
  # automatically advance old GC/retirement journals on a schedule.
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, unify, ack, retire, withdraw, reset-documents, remove-route, restore-route, verify-route, migrate-derived, resume-derived, redirect-derived, publish-generation, verify-generation]
        default: inspect
      resource_json:
        description: 'Migration requires root identities; optional read-only check_s3=true; apply/resume require external_writers_stopped=true'
        type: string
        default: '{}'
      expected_parent:
        description: Expected current v3 generation for withdrawal or route operation
        type: string
        default: none
      surface:
        type: choice
        options: [hf, pages]
        default: hf
      apply:
        description: Apply after complete validation under the central writer lock
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-sidecar
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: >-
      github.repository == 'anftm/pipeline' &&
      (vars.READER_V3_AUTO_PAUSED != 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation != 'auto'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      READER_V3_WRITE_PROTOCOL: central-reader-sidecar-v3-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Guard original document and legacy reference contracts
        run: python -m unittest tests.test_direct_document_policy tests.test_reader_storage_contract
      - name: Test page migration and fence
        if: contains(fromJSON('["migrate-derived","resume-derived","redirect-derived","unify","remove-route","restore-route"]'), inputs.operation)
        run: python -m unittest tests.test_reader_page_audit tests.test_reader_page_cas tests.test_reader_page_s3_preview tests.test_reader_page_migrate tests.test_reader_page_migration_fence tests.test_reader_page_atomic tests.test_reader_page_refresh
      - name: Verify and execute the central v3 operation
        id: operation
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ contains(fromJSON('["migrate-derived","resume-derived","redirect-derived","unify","remove-route","restore-route"]'), inputs.operation) && secrets.HF_S3_ACCESS_KEY_ID || '' }}
          HF_S3_SECRET_ACCESS_KEY: ${{ contains(fromJSON('["migrate-derived","resume-derived","redirect-derived","unify","remove-route","restore-route"]'), inputs.operation) && secrets.HF_S3_SECRET_ACCESS_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
          READER_V3_PREVIEW_FIRST: ${{ vars.READER_V3_PREVIEW_FIRST || 'false' }}
          READER_V3_DJVU_MIGRATION: ${{ vars.READER_V3_DJVU_MIGRATION || 'false' }}
          READER_DATASET_PRIMARY_ENABLED: ${{ vars.READER_DATASET_PRIMARY_ENABLED || 'false' }}
          OPERATION: ${{ inputs.operation }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          SURFACE: ${{ inputs.surface }}
          APPLY: ${{ inputs.apply }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Old scheduled or queued runs must not resume retirement after the
          # publisher is re-enabled. Manual dispatch is the only live entry.
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            echo "Scheduled v3 retirement is disabled" >&2
            exit 1
          fi
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          if [[ -z "$RESOURCE_JSON" ]]; then RESOURCE_JSON='{}'; fi
          args=("$OPERATION" --output output/v3/publication.json)
          case "$OPERATION" in
            withdraw|remove-route|restore-route|verify-route) args+=(--resource-json "$RESOURCE_JSON" --expected-parent "$EXPECTED_PARENT") ;;
            migrate-derived|resume-derived|redirect-derived) args+=(--resource-json "$RESOURCE_JSON") ;;
            publish-generation|verify-generation) args+=(--expected-parent "$EXPECTED_PARENT" --wait-seconds 1200) ;;
            unify|reset-documents) args+=(--resource-json "$RESOURCE_JSON") ;;
            retire) ;;
            ack) args+=(--surface "$SURFACE") ;;
            inspect) ;;
            *) exit 1 ;;
          esac
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python scripts/publish_reader_v3.py "${args[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "redirect_audited=$(jq -r '.redirect_audited // false' output/v3/publication.json)" >> "$GITHUB_OUTPUT"
      - name: Publish the pinned projection to Pages
        if: >-
          steps.operation.outputs.apply == 'true' &&
          steps.operation.outputs.changed == 'true' &&
          contains(fromJSON('["withdraw","unify","reset-documents","remove-route","restore-route","migrate-derived","resume-derived","redirect-derived","publish-generation"]'), steps.operation.outputs.operation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          GH_TOKEN: ${{ github.token }}
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
        run: |
          if [[ "$OPERATION" == publish-generation ]]; then
            actual=$(python scripts/publish_reader_v3.py inspect | jq -r '.pointer.generation')
            [[ "$actual" == "$EXPECTED_PARENT" ]] || { echo 'generation changed before Pages publication' >&2; exit 1; }
          fi
          if [[ "$OPERATION" == migrate-derived || "$OPERATION" == resume-derived ]]; then
            python scripts/publish_reader_v3.py check-page-window --resource-json "$RESOURCE_JSON"
          fi
          python scripts/publish_search_reader_index.py --pinned-only
      - name: Confirm both deployed consumer projections
        id: ack
        if: >-
          steps.operation.outputs.apply == 'true' &&
          steps.operation.outputs.changed == 'true' &&
          contains(fromJSON('["withdraw","unify","reset-documents","remove-route","restore-route","migrate-derived","resume-derived","redirect-derived","publish-generation"]'), steps.operation.outputs.operation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          REDIRECT_AUDITED: ${{ steps.operation.outputs.redirect_audited }}
        run: |
          if [[ "$OPERATION" == unify && "$REDIRECT_AUDITED" == true ]]; then
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
              --wait-seconds 1200 --output output/v3/migration-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == publish-generation ]]; then
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$EXPECTED_PARENT" \
              --wait-seconds 1200 --output output/v3/migration-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == migrate-derived || "$OPERATION" == resume-derived || "$OPERATION" == redirect-derived ]]; then
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
              --wait-seconds 1200 --output output/v3/migration-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == remove-route || "$OPERATION" == restore-route ]]; then
            # Verify the deployed projection without writing GC acknowledgments.
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-route --resource-json "$RESOURCE_JSON" \
              --expected-parent "$generation" --route-action "$OPERATION" --wait-seconds 1200 \
              --output output/v3/route-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/publish_reader_v3.py ack-all --apply --output output/v3/consumers.json
          echo "complete=$(jq -r '.complete // false' output/v3/consumers.json)" >> "$GITHUB_OUTPUT"
          # Record the base-catalog generation both deployments just confirmed.
          # The GC collector needs this to compact history; it never relied on
          # acknowledgments inside the 2 GB canonical catalog itself.
          if [[ "$(jq -r '.complete // false' output/v3/consumers.json)" == "true" ]]; then
            python scripts/publish_reader_v3.py acknowledge-legacy --apply \
              --output output/v3/acknowledgments.json
            ack_reason=$(jq -r '.reason // "recorded"' output/v3/acknowledgments.json)
            if [[ "$ack_reason" == "recorded" ]]; then
              # Shrink the base catalog in the ordinary publish path. The 2 GB
              # object would otherwise need a drained window just to stay bounded.
              python scripts/publish_reader_v3.py compact-legacy --apply \
                --output output/v3/catalog-compaction.json
              # The compaction rewrites the catalog, so refresh the receipt that
              # names its digest for the GC collector.
              python scripts/publish_reader_v3.py acknowledge-legacy --apply \
                --output output/v3/acknowledgments.json
            else
              echo "base acknowledgment deferred: $ack_reason"
            fi
          else
            echo "consumer projections are incomplete; base acknowledgment deferred"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-publication-report
          path: output/v3/*.json
          retention-days: 30
          if-no-files-found: warn
