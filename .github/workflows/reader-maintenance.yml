name: Reader/桶 · GC Automatic Maintenance

on:
  schedule:
    - cron: '13 2 * * *'
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Verify credentials and producer inventory without pausing workflows or deleting objects
        type: boolean
        default: false
      limit:
        description: Maximum objects to collect in this window; zero means all candidates
        required: true
        default: "0"
        type: string
      plan_only:
        description: Drain and plan without deleting anything
        required: true
        default: false
        type: boolean
      scope:
        description: Retired assets, a full sweep, or an exact page plan/apply
        type: choice
        options: [retired-assets, unreferenced, page-plan, page-apply, obsolete-pdf-references]
        default: retired-assets
      resume_run:
        description: Exact JSON for page-plan (paths) or page-apply (plan_run, plan_sha256, external_writers_stopped)
        type: string
        default: ''

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-global-maintenance
  cancel-in-progress: false
  queue: max

jobs:
  maintain:
    if: github.repository == 'anftm/pipeline' && (github.event_name == 'workflow_dispatch' || vars.READER_GC_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 500
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      GC_CENTRAL_TOKEN: ${{ github.token }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_NAMESPACE: melsm
      GH_TOKEN: ${{ github.token }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Verify maintenance activation and deletion barriers
        run: python -B -m unittest tests.test_reader_gc_activation tests.test_reader_gc_maintenance tests.test_reader_gc_collect tests.test_reader_page_delete
      - name: Verify every producer credential before isolation
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
        run: python -u scripts/reader_gc_maintenance.py preflight --journal output/maintenance/preflight.json
      - name: Pause producers, collect and restore
        if: inputs.preflight_only != true
        timeout-minutes: 450
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          LIMIT: ${{ inputs.limit || '0' }}
          PLAN_ONLY: ${{ inputs.plan_only || 'false' }}
          SCOPE: ${{ inputs.scope || 'retired-assets' }}
          RESUME_RUN: ${{ inputs.resume_run || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || exit 1
          if [[ "$SCOPE" == obsolete-pdf-references ]]; then [[ "$EVENT_NAME" == workflow_dispatch ]]; fi
          if [[ "$EVENT_NAME" == schedule && "$(date -u +%u)" == 1 ]]; then SCOPE=unreferenced; fi
          if [[ "$SCOPE" == obsolete-pdf-references ]]; then
            [[ "$EVENT_NAME" == workflow_dispatch && "$PLAN_ONLY" == false && "$LIMIT" == 0 ]]
            python -B -m unittest tests.test_reader_obsolete_pdf tests.test_reader_obsolete_pdf_apply tests.test_reader_obsolete_pdf_references tests.test_reader_obsolete_pdf_store tests.test_reader_obsolete_pdf_run
            mkdir -p output/maintenance
            python -c 'import os,pathlib; pathlib.Path("output/maintenance/obsolete-config.json").write_text(os.environ["RESUME_RUN"])'
            python -u -m scripts.reader_obsolete_pdf_run --config output/maintenance/obsolete-config.json --journal output/maintenance/journal.json --output output/maintenance/obsolete-result.json
            exit 0
          fi
          args=(run --journal output/maintenance/journal.json --limit "$LIMIT" --scope "$SCOPE" --resume-run "$RESUME_RUN")
          if [[ "$PLAN_ONLY" == "true" ]]; then args+=(--plan-only); fi
          python -u scripts/reader_gc_maintenance.py "${args[@]}"
      - name: Recover recorded producer state after an interrupted orchestration
        if: always() && inputs.preflight_only != true
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
        run: python -u scripts/reader_gc_maintenance.py restore --journal output/maintenance/journal.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-maintenance-journal
          path: output/maintenance/*.json
          retention-days: 90
          if-no-files-found: error
