name: Reader/桶 · Build Image WebP Assets
run-name: ${{ inputs.automation_id && format('reader-auto/{0}', inputs.automation_id) || 'Reader/桶 · Build Image WebP Assets' }}

on:
  # Manual bounded batches; no index reset and no automatic backlog run.
  workflow_dispatch:
    inputs:
      automation_id:
        description: Optional controller correlation ID (32 lowercase hex characters)
        required: false
        default: ""
        type: string
      search_generation:
        description: Published search generation for the automatic batch (64 lowercase hex)
        required: false
        default: ""
        type: string
      expected_sha:
        description: Controller pipeline main commit (40 lowercase hex)
        required: false
        default: ""
        type: string
      defer_unify:
        description: Let the controller unify and verify after canonical indexes and sidecar finish
        required: false
        default: false
        type: boolean
      extension:
        description: Image extension, or all
        required: true
        default: all
        type: choice
        options: [all, jpg, jpeg, png, bmp, webp, gif, tif, tiff]
      limit:
        description: Maximum attempts per shard; apply requires 1-3, plan allows 0
        required: true
        default: "1"
        type: string
      shard:
        description: Shard 0-7, or all (each shard has its own limit)
        required: true
        default: all
        type: choice
        options: [all, "0", "1", "2", "3", "4", "5", "6", "7"]
      retry_failures:
        description: Retry recorded image conversion failures
        required: true
        default: false
        type: boolean
      apply:
        description: Convert and publish; false is report-only
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-images
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - &automation-gate
        name: Validate automation and current main
        env:
          AUTOMATION_ID: ${{ inputs.automation_id }}
          AUTOMATION_ENABLED: ${{ vars.READER_FORMAT_AUTOMATION_ENABLED }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEFER_UNIFY: ${{ inputs.defer_unify }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$AUTOMATION_ID$SEARCH_GENERATION$EXPECTED_SHA" && "$DEFER_UNIFY" != 'true' ]]; then exit 0; fi
          [[ "$SEARCH_GENERATION" =~ ^[0-9a-f]{64}$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$DEFER_UNIFY" == 'true' ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$AUTOMATION_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'automation_id must be 32 lowercase hex characters' >&2; exit 1; }
          [[ "$AUTOMATION_ENABLED" == 'true' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/reader-image-stream.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          local_sha=$(git rev-parse HEAD)
          [[ "$local_sha" == "$GITHUB_SHA" ]]
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$remote_sha" == "$GITHUB_SHA" ]]
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - &source-guard
        name: Bind automatic batch to published search sources
        if: inputs.automation_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python scripts/reader_format_daily.py guard-source \
            --generation "$SEARCH_GENERATION" --expected-sha "$EXPECTED_SHA" \
            --revisions state/commits.json
      - name: Plan pending ordinary image workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTENSION: ${{ inputs.extension || 'all' }}
          SHARD: ${{ inputs.shard || 'all' }}
          LIMIT: ${{ inputs.limit || '1' }}
          APPLY: ${{ inputs.apply }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo 'limit must be non-negative' >&2; exit 1; }
          [[ "$SHARD" == 'all' || "$SHARD" =~ ^[0-7]$ ]] || { echo 'invalid shard' >&2; exit 1; }
          if [[ "$APPLY" == 'true' && ! "$LIMIT" =~ ^[1-3]$ ]]; then
            echo 'apply requires 1-3 attempts per shard' >&2; exit 1
          fi
          args=(--kind image --extension "$EXTENSION" --output output/image-matrix.json
                --verify-source-sha --report output/image-report.json)
          if [[ "$SHARD" != 'all' ]]; then args+=(--shard-index "$SHARD"); fi
          if [[ "$RETRY_FAILURES" == 'true' ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/image-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/image-plan.tgz output/search_data.json state/commits.json output/image-matrix.json output/image-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-image-plan
          path: output/image-plan.tgz
          retention-days: 1

  build:
    needs: plan
    if: >-
      inputs.apply == true &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reader-image-plan
          path: output
      - run: tar -xzf output/image-plan.tgz
      - *automation-gate
      - *source-guard
      - name: Build single-image WebP assets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          EXTENSION: ${{ matrix.extension }}
          SHARD: ${{ matrix.shard }}
          LIMIT: ${{ inputs.limit || '1' }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[1-3]$ && "$SHARD" =~ ^[0-7]$ ]] || exit 1
          args=(--extension "$EXTENSION" --limit "$LIMIT" --shard-count 8 --shard-index "$SHARD" --apply --strict)
          if [[ "$RETRY_FAILURES" == 'true' ]]; then args+=(--retry-failures); fi
          python scripts/pilot_image_page_stream.py "${args[@]}"

  finalize:
    needs: [plan, build]
    if: >-
      always() && needs.plan.result == 'success' &&
      inputs.apply == true && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - *automation-gate
      - name: Merge v2 image indexes
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
        run: python scripts/finalize_image_index.py --apply
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        if: inputs.defer_unify != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
