name: Reader/桶 · Build Media Streams
run-name: ${{ inputs.automation_id && format('reader-auto/{0}', inputs.automation_id) || format('Media streams {0} ({1})', inputs.apply == true && 'apply' || 'plan', inputs.kind || 'all') }}

on:
  # Resume by reviewed manual batches; do not restart the unlimited daily run.
  workflow_dispatch:
    inputs:
      automation_id:
        description: Optional controller correlation ID (32 lowercase hex characters)
        required: false
        default: ""
        type: string
      search_generation:
        description: Published search generation for the automatic batch (64 lowercase hex)
        required: false
        default: ""
        type: string
      expected_sha:
        description: Controller pipeline main commit (40 lowercase hex)
        required: false
        default: ""
        type: string
      defer_unify:
        description: Let the controller unify and verify after canonical indexes and sidecar finish
        required: false
        default: false
        type: boolean
      extension:
        description: Source media extension within the selected kind, or all
        required: false
        default: all
        type: choice
        options: [all, aac, amr, ape, asx, avi, f4v, flac, flv, m4a, mkv, mov, mp3, mp4, mpeg, mpg, mpga, mts, rm, rmvb, swf, ts, wav, wma, wmv]
      kind:
        description: Media kind, or all
        required: true
        default: all
        type: choice
        options: [all, audio, video, swf]
      boost_canary:
        description: Reserved for the guarded one-batch MP3 canary
        type: boolean
        default: false
      limit:
        description: Maximum attempts per shard (normally 1-3 for apply; MP3 canary up to 8)
        required: true
        default: "1"
        type: string
      apply:
        description: Convert and publish media streams
        required: true
        default: false
        type: boolean
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-media
  cancel-in-progress: false
  queue: max

jobs:
  codecs:
    needs: plan
    if: inputs.apply == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python scripts/verify_reader_media_codecs.py --output output/media-codecs.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-media-codecs
          path: output/media-codecs.json
          retention-days: 14

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - &automation-gate
        name: Validate automation and current main
        env:
          AUTOMATION_ID: ${{ inputs.automation_id }}
          AUTOMATION_ENABLED: ${{ vars.READER_FORMAT_AUTOMATION_ENABLED }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEFER_UNIFY: ${{ inputs.defer_unify }}
          BOOST_CANARY: ${{ inputs.boost_canary }}
          READER_MP3_BATCH_BOOST_ENABLED: ${{ vars.READER_MP3_BATCH_BOOST_ENABLED }}
          EXTENSION: ${{ inputs.extension }}
          KIND: ${{ inputs.kind }}
          LIMIT: ${{ inputs.limit || '1' }}
          APPLY: ${{ inputs.apply }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${BOOST_CANARY:-false}" == 'true' ]]; then
            python scripts/reader_ordinary_boost.py mp3
          fi
          if [[ -z "$AUTOMATION_ID$SEARCH_GENERATION$EXPECTED_SHA" && "$DEFER_UNIFY" != 'true' ]]; then exit 0; fi
          [[ "$SEARCH_GENERATION" =~ ^[0-9a-f]{64}$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$DEFER_UNIFY" == 'true' ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$AUTOMATION_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'automation_id must be 32 lowercase hex characters' >&2; exit 1; }
          [[ "$AUTOMATION_ENABLED" == 'true' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/reader-media-stream.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          local_sha=$(git rev-parse HEAD)
          [[ "$local_sha" == "$GITHUB_SHA" ]]
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$remote_sha" == "$GITHUB_SHA" ]]
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: "true"
        run: python scripts/fetch_and_parse.py
      - &source-guard
        name: Bind automatic batch to published search sources
        if: inputs.automation_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python scripts/reader_format_daily.py guard-source \
            --generation "$SEARCH_GENERATION" --expected-sha "$EXPECTED_SHA" \
            --revisions state/commits.json
      - name: Select actionable sources for automatic batch
        if: inputs.automation_id != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          EXTENSION: ${{ inputs.extension }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          BOOST_CANARY: ${{ inputs.boost_canary }}
          LIMIT: ${{ inputs.limit || '1' }}
        run: |
          set -euo pipefail
          [[ -n "$EXTENSION" && "$EXTENSION" != 'all' ]]
          args=()
          if [[ "$BOOST_CANARY" == 'true' ]]; then args+=(--boost-limit "$LIMIT"); fi
          python scripts/reader_format_sources.py --extension "$EXTENSION" \
            --generation "$SEARCH_GENERATION" --search-data output/search_data.json \
            --revisions state/commits.json --output output/reader-actionable.json "${args[@]}"
          mv output/reader-actionable.json output/search_data.json
      - name: Plan pending media workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KIND: ${{ inputs.kind || 'all' }}
          EXTENSION: ${{ inputs.extension || 'all' }}
          LIMIT: ${{ inputs.limit || '1' }}
          APPLY: ${{ inputs.apply }}
          BOOST_CANARY: ${{ inputs.boost_canary }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          if [[ "${BOOST_CANARY:-false}" != 'true' && "$APPLY" == 'true' && ! "$LIMIT" =~ ^[1-3]$ ]]; then
            echo 'apply requires 1-3 attempts per shard without canary intent' >&2; exit 1
          fi
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo 'limit must be non-negative' >&2; exit 1; }
          args=(--kind media --extension "$KIND" --media-extension "$EXTENSION" --output output/media-matrix.json --verify-source-sha --report output/media-report.json)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/media-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/media-plan.tgz output/search_data.json state/commits.json output/media-matrix.json output/media-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-media-plan
          path: output/media-plan.tgz
          retention-days: 1

  media:
    needs: plan
    if: >-
      inputs.apply == true &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Sharded uploads and checkpoints must not race the canonical handoff.
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: reader-media-plan
          path: output
      - run: tar -xzf output/media-plan.tgz
      - *automation-gate
      - *source-guard
      - name: Build and publish media streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          KIND: ${{ matrix.extension }}
          EXTENSION: ${{ inputs.extension || 'all' }}
          SHARD: ${{ matrix.shard }}
          LIMIT: ${{ inputs.limit || '1' }}
          BOOST_CANARY: ${{ inputs.boost_canary }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "${BOOST_CANARY:-false}" == 'true' || "$LIMIT" =~ ^[1-3]$ ]] || exit 1
          [[ "$SHARD" =~ ^[0-7]$ ]] || exit 1
          args=(--kind "$KIND" --extension "$EXTENSION" --limit "$LIMIT"
                --shard-count 8 --shard-index "$SHARD" --apply --strict)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_media_stream.py "${args[@]}"

  finalize:
    needs: [plan, media, codecs]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.codecs.result == 'success' &&
      inputs.apply == true && needs.media.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - *automation-gate
      - name: Merge canonical media indexes
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
        run: python scripts/finalize_media_indexes.py
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        if: inputs.defer_unify != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
