name: Reader/桶 · Publish Account PDF Worker Results
run-name: PDF publish ${{ inputs.stage }} / ${{ inputs.worker_repository }} / ${{ inputs.worker_run_id }}

on:
  workflow_dispatch:
    inputs:
      worker_repository:
        description: Historical account repository (OCR publication is retired)
        type: string
        required: true
      worker_run_id:
        description: Completed account worker run
        type: string
        required: true
      stage:
        type: choice
        options: [render, ocr]
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-sidecar
  cancel-in-progress: false
  queue: max

env:
  # Retained solely in existing OCR identity strings; no Reader JXL encoding.
  PDF_JXL_ENABLED: "true"
  PDF_OCR_LANG: auto
  PDF_OCR_BACKEND: rapidocr_onnxruntime

jobs:
  publish:
    # Old account artifacts must not recreate retired OCR/text references.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Validate worker repository and completed run
        id: worker
        env:
          GH_TOKEN: ${{ secrets.PDF_WORKER_READ_TOKEN }}
          WORKER_REPOSITORY: ${{ inputs.worker_repository }}
          WORKER_RUN_ID: ${{ inputs.worker_run_id }}
        run: python scripts/validate_pdf_worker_run.py --repository "$WORKER_REPOSITORY" --run-id "$WORKER_RUN_ID"
      - uses: actions/download-artifact@v8
        with:
          name: pdf-account-queue
          path: output/pdf-ocr
          github-token: ${{ secrets.PDF_WORKER_READ_TOKEN }}
          repository: ${{ inputs.worker_repository }}
          run-id: ${{ inputs.worker_run_id }}
      - name: Validate queue ownership and configuration generation
        id: queue
        env:
          WORKER_OWNER: ${{ steps.worker.outputs.owner }}
          STAGE: ${{ inputs.stage }}
        run: |
          python scripts/pdf_worker_lanes.py --owner "$WORKER_OWNER" --stage "$STAGE" --queue output/pdf-ocr/queue.json
          echo "shard_count=$(jq -r '.shard_count' output/pdf-ocr/queue.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        if: steps.queue.outputs.shard_count != '0'
        with:
          pattern: pdf-account-results-*
          path: output/pdf-ocr/results
          github-token: ${{ secrets.PDF_WORKER_READ_TOKEN }}
          repository: ${{ inputs.worker_repository }}
          run-id: ${{ inputs.worker_run_id }}
      - run: pip install -r scripts/requirements.txt
      - name: Publish verified results and retained partial progress
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          STAGE: ${{ inputs.stage }}
        run: timeout --signal=TERM --kill-after=5m 150m python -u scripts/pdf_ocr_stages.py "publish-$STAGE" --publish-batch-size 4 --results-dir output/pdf-ocr/results
      - name: Publish Reader sidecar to Pages
        if: always() && !cancelled() && steps.queue.outcome == 'success'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
        run: python scripts/publish_search_reader_index.py
      - name: Capture deduplicated PDF/OCR progress
        if: always()
        timeout-minutes: 10
        continue-on-error: true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/pdf_progress_report.py --record --output output/pdf-ocr/pdf-progress.json
      - name: Admit at most one next OCR batch for this account
        if: inputs.stage == 'render' || inputs.stage == 'ocr'
        env:
          GH_TOKEN: ${{ secrets.PDF_WORKER_READ_TOKEN }}
          WORKER_REPOSITORY: ${{ inputs.worker_repository }}
          WORKER_RUN_ID: ${{ inputs.worker_run_id }}
        run: |
          python scripts/pdf_worker_dispatch.py --repository "$WORKER_REPOSITORY" \
            --after-run "$WORKER_RUN_ID" --apply --output output/pdf-ocr/dispatch.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pdf-progress-${{ inputs.stage }}-${{ inputs.worker_run_id }}
          path: |
            output/pdf-ocr/pdf-progress.json
            output/pdf-ocr/bundle/publication.json
            output/pdf-ocr/bundle/quality-report.json
            output/pdf-ocr/dispatch.json
          retention-days: 30
          if-no-files-found: warn
