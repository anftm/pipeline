name: Keep HuggingFace Spaces Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all Spaces
        run: |
          urls=(
            "https://vomebook-hitokoto.hf.space/"
            "https://voiceofml-search.hf.space/"
            "https://vomebook-search.hf.space/"
            "https://vomebook-bha-search.hf.space/"
          )
          failed=()

          for url in "${urls[@]}"; do
            echo "--- Pinging: $url ---"
            if response=$(curl --silent --show-error --fail --output /dev/null \
              --write-out "%{http_code}" --max-time 30 \
              --retry 2 --retry-delay 5 --retry-all-errors "$url"); then
              echo "HTTP Status: $response"
              if [ "$response" = "200" ]; then
                echo "Success"
              else
                echo "Warning: got HTTP $response"
                failed+=("$url (HTTP $response)")
              fi
            else
              if [ -n "$response" ] && [ "$response" != "000" ]; then
                echo "Warning: got HTTP $response after retries"
                failed+=("$url (HTTP $response)")
              else
                echo "Warning: request failed after retries"
                failed+=("$url (request failed)")
              fi
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed Space checks:"
            printf '  - %s\n' "${failed[@]}"
            exit 1
          fi
