name: BHA · Build Reviewed Parsed Candidate

on:
  workflow_dispatch:
    inputs:
      plan_run:
        description: Successful bha-build-plan run on this revision
        type: string
        required: true
      plan_sha256:
        description: Exact SHA-256 of reviewed build-plan.json
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: maintain-archive-forks
  cancel-in-progress: false
  queue: max

jobs:
  candidate:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Verify candidate contracts
        run: python -B -m unittest tests.test_bha_parsed_candidate_runner tests.test_bha_parsed_candidate tests.test_bha_parsed_git_integration tests.test_build_fork_parsed tests.test_bha_build_candidate_workflow
      - name: Validate request
        env:
          PLAN_RUN: ${{ inputs.plan_run }}
          PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          [[ "$PLAN_RUN" =~ ^[1-9][0-9]*$ && "$PLAN_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
      - uses: actions/download-artifact@v8
        with:
          name: bha-readonly-build-plan
          path: ${{ runner.temp }}/bha-build-plan
          run-id: ${{ inputs.plan_run }}
          github-token: ${{ github.token }}
      - name: Verify plan provenance
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_RUN: ${{ inputs.plan_run }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PLAN_RUN" > "$RUNNER_TEMP/bha-build-plan-run.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'bha-build-plan-run.json').read_bytes())
          if (r.get('conclusion')!='success' or r.get('status')!='completed' or r.get('run_attempt')!=1
                  or r.get('event')!='workflow_dispatch' or r.get('head_branch')!='main'
                  or r.get('repository',{}).get('full_name')!='anftm/pipeline'
                  or r.get('path','').split('@',1)[0]!='.github/workflows/bha-build-plan.yml'
                  or r.get('head_sha')!=os.environ['GITHUB_SHA']):
              raise SystemExit('build plan provenance differs')
          PY
      - name: Build local candidate without publishing
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PLAN_SHA: ${{ inputs.plan_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p output/bha-candidate
          python -u -m scripts.bha_parsed_candidate --plan "$RUNNER_TEMP/bha-build-plan/build-plan.json" \
            --plan-sha256 "$PLAN_SHA" --output output/bha-candidate/result.json \
            --bundle output/bha-candidate/parsed.bundle
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bha-parsed-candidate
          path: output/bha-candidate/
          retention-days: 7
          if-no-files-found: warn
