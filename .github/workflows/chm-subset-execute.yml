name: CHM exact 352 subset retirement

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RETIRE-352 to resume the fixed CHM subset
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  retire:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RETIRE-352'
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/chm-subset-execute-inner.yml
    secrets: inherit
