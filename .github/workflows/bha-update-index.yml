name: BHA · Inspect Parsed Revisions

on:
  # Read-only until rebuilding parsed branches and delivering an index to the
  # BHA consumer have an independently reviewed, recoverable write protocol.
  workflow_dispatch:
    inputs:
      archive_id:
        description: One archive number from 0 through 31
        type: string
        default: '0'
        required: true

concurrency:
  group: update-bha-index
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Compare parsed tree to recorded baseline
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ARCHIVE_ID: ${{ inputs.archive_id }}
        run: |
          [[ "$ARCHIVE_ID" =~ ^([0-9]|[12][0-9]|3[01])$ ]] || exit 1
          python3 scripts/check_bha_parsed_readonly.py --archive "$ARCHIVE_ID" --output output/bha/parsed-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: bha-parsed-report
          path: output/bha/parsed-report.json
          retention-days: 30
          if-no-files-found: error
