name: Maintain Archive Forks

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

concurrency:
  group: maintain-archive-forks
  cancel-in-progress: false

jobs:
  forks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v7

      - name: Maintain anftm forks and data branches
        run: python3 scripts/fork_repositories.py
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          UPSTREAM_OWNER: banned-historical-archives
          MIRROR_OWNER: anftm
