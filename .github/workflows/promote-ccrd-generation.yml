name: Promote CCRD Generation

on:
  workflow_dispatch:
    inputs:
      generation:
        description: Existing generation directory to promote
        required: true
        default: ccrd-a6b1615054303740-293f0c65db6a4709

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/promote_ccrd_generation.py "${{ inputs.generation }}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
