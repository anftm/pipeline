name: Keep HuggingFace Spaces Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all Spaces
        run: |
          urls=(
            "https://vomebook-hitokoto.hf.space/"
            "https://voiceofml-search.hf.space/"
            "https://vomebook-search.hf.space/"
            "https://vomebook-bha-search.hf.space/"
          )

          for url in "${urls[@]}"; do
            echo "--- Pinging: $url ---"
            response=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url")
            echo "HTTP Status: $response"
            if [ "$response" -eq 200 ]; then
              echo "✅ Success"
            else
              echo "⚠️  Warning: got $response"
            fi
          done
