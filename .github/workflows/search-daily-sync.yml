name: 搜索 · Daily Sync

on:
  schedule:
    # The same run generates catalogues before publishing the search index.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: Rebuild and publish even when source revisions are unchanged
        type: boolean
        default: false
      target:
        description: "all/hf-space: stage changed search data and verify both sites; directories: source directories only"
        type: choice
        default: all
        options:
          - all
          - hf-space
          - directories

permissions:
  contents: write

concurrency:
  group: daily-sync
  cancel-in-progress: false
  queue: max

jobs:
  directories:
    # The directory-only manual action must never publish search or state.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'directories'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Update generated directories
        run: python scripts/update_dirs.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

  sync:
    if: inputs.target != 'directories'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: ${{ inputs.target || 'all' }}

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate and verify source directories
        run: python -u scripts/update_dirs.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DIRECTORY_REVISIONS_FILE: ${{ runner.temp }}/search-directory-revisions.json

      - name: Fetch and parse
        id: fetch
        run: python scripts/fetch_and_parse.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          DIRECTORY_REVISIONS_FILE: ${{ runner.temp }}/search-directory-revisions.json
          FORCE_SYNC: ${{ (inputs.force_sync || inputs.target == 'hf-space') && 'true' || 'false' }}

      - name: Stage immutable search generation
        id: stage
        if: steps.fetch.outputs.data_changed == 'true'
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python -B scripts/search_daily.py stage \
            --source output/search_data.json --tree output/folder_tree.json \
            --browser output/folder_browser.json --revisions "$RUNNER_TEMP/search-directory-revisions.json" \
            --output "$RUNNER_TEMP/search-generation"

      - name: Verify published generation and both consumers
        id: published
        run: python -B scripts/search_daily.py inspect

      - name: Fail closed when a new generation awaits promotion
        if: steps.fetch.outputs.data_changed == 'true'
        env:
          STAGED_GENERATION: ${{ steps.stage.outputs.generation }}
          PUBLISHED_GENERATION: ${{ steps.published.outputs.generation }}
        run: |
          set -euo pipefail
          if [[ "$STAGED_GENERATION" != "$PUBLISHED_GENERATION" ]]; then
            echo "A new immutable search generation is staged but not yet promoted." >&2
            echo "candidate=$STAGED_GENERATION published=$PUBLISHED_GENERATION" >&2
            exit 1
          fi

      - name: Verify source revisions are fully published
        env:
          PUBLISHED_REVISIONS: ${{ steps.published.outputs.source_revisions }}
          SOURCE_REVISIONS_FILE: ${{ runner.temp }}/search-directory-revisions.json
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          actual = json.loads(Path(os.environ['SOURCE_REVISIONS_FILE']).read_bytes())
          published = json.loads(os.environ['PUBLISHED_REVISIONS'])
          if actual != published:
              raise SystemExit('Source revisions differ from the two-site published generation')
          print('Both sites use the current source revision snapshot')
          PY
