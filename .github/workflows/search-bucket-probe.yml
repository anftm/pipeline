name: 搜索 · Verify Bucket Conditions
run-name: Search bucket conditional probe / ${{ inputs.apply && 'one test key' || 'dry run' }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create and conditionally delete exactly one random test object
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: search-bucket-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install exact search probe dependencies
        run: python -m pip install boto3==1.43.123 huggingface_hub==1.33.0 hf-xet==1.8.0
      - name: Verify probe rejects uncertain and unsafe operations
        run: python -B -m unittest -v tests.test_search_bucket_probe
      - name: Run one explicit bounded probe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          if [[ "$APPLY" == "true" ]]; then
            python -B scripts/search_bucket_probe.py --apply
          else
            python -B scripts/search_bucket_probe.py
          fi
