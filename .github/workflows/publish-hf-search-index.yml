name: Publish HF Search Index

on:
  workflow_dispatch:

concurrency:
  group: publish-hf-search-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and parse current metadata
        run: python scripts/fetch_and_parse.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Publish metadata and n-gram indexes to HF Search
        run: python scripts/sync_to_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
