name: Update BHA index

on:
  schedule:
    - cron: "*/15 * * * *"
  repository_dispatch:
    types: [ocr-rebase-reviewed]
  workflow_dispatch:
    inputs:
      archive_id:
        description: Archive numbers 0-31 (comma-separated), or all
        required: false
        default: all
        type: string
      force_rebuild:
        description: Force regeneration of the selected parsed archive
        required: false
        default: false
        type: boolean
      allow_ocr_patch_rebase:
        description: Accept a reviewed OCR baseline update for selected archives with local patches
        required: false
        default: false
        type: boolean

concurrency:
  group: update-bha-index
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Build changed anftm parsed branches
        id: parsed
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ARCHIVE_ID: ${{ github.event.client_payload.archive_id || inputs.archive_id || 'all' }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
          ALLOW_OCR_PATCH_REBASE: ${{ github.event.client_payload.allow_ocr_patch_rebase || inputs.allow_ocr_patch_rebase || 'false' }}
        run: python3 scripts/build_fork_parsed.py
      - name: Maintain OCR conflict issues
        if: always()
        env:
          TRACKER_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.parsed.outcome }}
          ARCHIVE_ID: ${{ github.event.client_payload.archive_id || inputs.archive_id || 'all' }}
          BHA_BASE_URL: ${{ vars.BHA_BASE_URL || 'https://vomebook-bha-search.hf.space' }}
        run: python3 scripts/report_ocr_patch_conflicts.py
      - name: Record parsed input state
        if: steps.parsed.outputs.state_changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git pull --rebase origin "${DEFAULT_BRANCH}"
          mv /tmp/bha-parsed-inputs.json state/bha-parsed-inputs.json
          git add state/bha-parsed-inputs.json
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update BHA parsed input state"
          git push origin "HEAD:${DEFAULT_BRANCH}" || {
            git pull --rebase origin "${DEFAULT_BRANCH}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          }
      - name: Check parsed revisions
        id: revisions
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          BHA_ARCHIVE_OWNER: anftm
        run: python3 scripts/check_bha_revisions.py
      - name: Refresh proofreading review queue
        env:
          TRACKER_TOKEN: ${{ github.token }}
        run: python3 scripts/update_proofread_issues.py
      - name: Trigger incremental BHA index update
        if: steps.revisions.outputs.changed == 'true'
        env:
          BHA_BASE_URL: ${{ vars.BHA_BASE_URL || 'https://vomebook-bha-search.hf.space' }}
          BHA_REINDEX_TOKEN: ${{ secrets.BHA_REINDEX_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = {
              "archive_commits": json.loads(Path("/tmp/bha-parsed-commits.json").read_text()),
              "archive_revisions": json.loads(Path("/tmp/bha-parsed-revisions.json").read_text()),
              "changed_archives": [
                  int(value) for value in "${{ steps.revisions.outputs.changed_archives }}".split(",") if value
              ],
          }
          Path("/tmp/bha-reindex-request.json").write_text(json.dumps(payload))
          PY
          accepted=false
          for attempt in $(seq 1 180); do
            status=$(curl --silent --show-error --output /tmp/bha-reindex-response.json --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer ${BHA_REINDEX_TOKEN}" \
              --header "Content-Type: application/json" --data-binary @/tmp/bha-reindex-request.json \
              "${BHA_BASE_URL%/}/api/reindex" || true)
            if test "$status" = "202"; then
              accepted=true
              break
            fi
            python3 - "$attempt" "$status" <<'PY'
          import sys
          from pathlib import Path

          print(f"reindex attempt {sys.argv[1]} returned HTTP {sys.argv[2]}")
          print(Path("/tmp/bha-reindex-response.json").read_text(encoding="utf-8", errors="replace"))
          PY
            case "$status" in
              409|429) sleep 10 ;;
              *) exit 1 ;;
            esac
          done
          test "$accepted" = "true"
      - name: Wait for accepted revisions
        if: steps.revisions.outputs.changed == 'true'
        env:
          BHA_BASE_URL: ${{ vars.BHA_BASE_URL || 'https://vomebook-bha-search.hf.space' }}
          BHA_REINDEX_TOKEN: ${{ secrets.BHA_REINDEX_TOKEN }}
        run: |
          for attempt in $(seq 1 1080); do
            status=$(curl --silent --show-error --output /tmp/bha-reindex-status.json --write-out '%{http_code}' \
              --header "Authorization: Bearer ${BHA_REINDEX_TOKEN}" \
              "${BHA_BASE_URL%/}/api/reindex/status" || true)
            if test "$status" = "200" && python3 - "$attempt" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = json.loads(Path("/tmp/bha-parsed-revisions.json").read_text())
          actual = json.loads(Path("/tmp/bha-reindex-status.json").read_text())
          revisions = actual.get("archive_revisions") or {}
          if actual.get("index_status") == "ready" and revisions == expected:
              raise SystemExit(0)
          differing = [key for key in sorted(set(expected) | set(revisions), key=lambda value: int(value)) if expected.get(key) != revisions.get(key)]
          print(json.dumps({
              "attempt": int(sys.argv[1]),
              "index_status": actual.get("index_status"),
              "progress": actual.get("progress"),
              "differing_archives": differing,
              "revision_differences": {
                  key: {"expected": expected.get(key), "actual": revisions.get(key)}
                  for key in differing
              },
           }, ensure_ascii=False))
          if actual.get("index_status") == "failed":
              raise SystemExit(2)
          if int(sys.argv[1]) >= 60 and actual.get("index_status") == "ready":
              raise SystemExit(2)
          raise SystemExit(1)
          PY
            then
              exit 0
            elif test "$?" = "2"; then
              exit 1
            fi
            sleep 5
          done
          exit 1
      - name: Record accepted revisions
        if: steps.revisions.outputs.baseline == 'true' || steps.revisions.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git pull --rebase origin "${DEFAULT_BRANCH}"
          test ! -f /tmp/bha-parsed-revisions.json || mv /tmp/bha-parsed-revisions.json state/bha-parsed-revisions.json
          git add state/bha-parsed-revisions.json
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update BHA parsed revisions"
          git push origin "HEAD:${DEFAULT_BRANCH}" || {
            git pull --rebase origin "${DEFAULT_BRANCH}"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          }
