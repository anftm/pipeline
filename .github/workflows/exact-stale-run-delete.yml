name: Reader · Delete two stale queued v3 runs

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE-TWO-STALE-V3-RUNS to remove only the two fixed run IDs
        required: true
        type: string

permissions:
  contents: read

jobs:
  delete:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'DELETE-TWO-STALE-V3-RUNS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install httpx==0.28.1 pyyaml==6.0.2
      - name: Test exact-run cleanup safety
        run: python -B -m unittest tests.test_exact_stale_run_delete -q
      - name: Delete only the two fixed stale run records
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
        run: python -u -B scripts/exact_stale_run_delete.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: exact-stale-run-delete-evidence
          path: output/exact-stale-run-delete/*.json
          retention-days: 90
          if-no-files-found: warn
