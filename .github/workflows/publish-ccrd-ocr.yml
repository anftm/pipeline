name: CCRD · Publish Verified OCR Release

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_run:
    workflows: ['Publish Account PDF Worker Results', 'Publish v3 Reading Generation', 'Reader/桶 · Publish Account PDF Worker Results', 'Reader/桶 · Publish v3 Reading Generation']
    types: [completed]
  workflow_dispatch:
    inputs:
      automatic:
        description: Discover and aggregate complete OCR; no proofreading or model calls
        type: boolean
        default: false
      limit:
        description: Maximum complete new or updated books per automatic batch (1..32)
        type: string
        default: '8'
      retry_failures:
        description: Retry quarantined exact inputs; ordinary schedules wait for changed inputs
        type: boolean
        default: false
      rebase:
        description: Rebuild the full OCR release when the base metadata changed, reusing live exports
        type: boolean
        default: false
      source_json:
        description: Optional exact repo/path JSON for the first automatic pilot; empty means all ready sources
        type: string
        default: '{}'
      stage_run_id:
        description: Successful central stage-ccrd-ocr-text.yml run containing the full approved artifact
        type: string
        required: false
      release_path:
        description: Exact OCR manifest path, or public anftm/pipeline Release transport URL for the full newspaper rollout
        type: string
        required: false
      release_sha256:
        description: Approved full OCR manifest or newspaper transport descriptor SHA-256
        type: string
        required: false
      expected_parent:
        description: Existing OCR generation or none for the first additive release
        type: string
        default: none
      apply:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    if: github.repository == 'anftm/pipeline' && github.event_name == 'workflow_dispatch' && !inputs.automatic && !startsWith(inputs.release_path, 'https://')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CCRD_OCR_WRITE_PROTOCOL: central-ccrd-ocr-publication-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Verify the exact stage run identity
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE_RUN_ID: ${{ inputs.stage_run_id }}
        run: |
          [[ "$STAGE_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE_RUN_ID" > stage-run.json
          python - <<'PY'
          import json
          from pathlib import Path
          run = json.loads(Path('stage-run.json').read_text())
          if (run['path'] != '.github/workflows/stage-ccrd-ocr-text.yml'
                  or run['status'] != 'completed' or run['conclusion'] != 'success'):
              raise ValueError('OCR publication requires a successful actual central stage run')
          PY
      - uses: actions/download-artifact@v7
        with:
          name: ccrd-ocr-text-and-index-candidate
          path: output/ccrd-ocr-candidate
          run-id: ${{ inputs.stage_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the approved additive release and publish without deletion
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          RELEASE_PATH: ${{ inputs.release_path }}
          RELEASE_SHA256: ${{ inputs.release_sha256 }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          APPLY: ${{ inputs.apply }}
        run: |
          metadata_sha=$(python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('output/ccrd-ocr-candidate/release-receipt.json').read_text())
          print(receipt['manifest']['base_metadata_sha256'])
          PY
          )
          args=()
          if [[ "$APPLY" == true ]]; then args+=(--apply --activate-space); fi
          python -B scripts/publish_ccrd_ocr.py --root output/ccrd-ocr-candidate \
            --release-path "$RELEASE_PATH" --release-sha256 "$RELEASE_SHA256" \
            --base-metadata-sha256 "$metadata_sha" --expected-parent "$EXPECTED_PARENT" \
            "${args[@]}" --output output/ccrd-publication.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ccrd-ocr-publication-receipt
          path: output/ccrd-publication.json
          if-no-files-found: warn
          retention-days: 30
  automatic:
    if: >-
      github.repository == 'anftm/pipeline' &&
      ((github.event_name == 'workflow_dispatch' && inputs.automatic && !startsWith(inputs.release_path, 'https://')) ||
       (vars.CCRD_OCR_AUTO_ENABLED == 'true' &&
        (github.event_name == 'schedule' ||
         (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          contains(fromJSON('[".github/workflows/pdf-account-publish.yml",".github/workflows/reader-v3-publish.yml"]'), github.event.workflow_run.path)))))
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCRD_OCR_WRITE_PROTOCOL: central-ccrd-ocr-publication-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Aggregate complete OCR TXT and rebuild the complete independent OCR index
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply }}
          LIMIT: ${{ inputs.limit || '8' }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
          REBASE: ${{ inputs.rebase }}
          SOURCE_JSON: ${{ inputs.source_json || '{}' }}
        run: |
          args=(--limit "$LIMIT" --source-json "$SOURCE_JSON" --output output/ccrd-ocr-auto/publication.json)
          if [[ "$APPLY" == true ]]; then args+=(--apply --activate-space); fi
          if [[ "$RETRY_FAILURES" == true ]]; then args+=(--retry-failures); fi
          if [[ "$REBASE" == true ]]; then args+=(--rebase); fi
          python -B scripts/auto_ccrd_ocr.py "${args[@]}"
      - name: Verify the exact live generation, complete OCR IDs and readable full text
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        timeout-minutes: 25
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if jq -e '.generation' output/ccrd-ocr-auto/publication.json > /dev/null; then
            python -B scripts/verify_ccrd_ocr_live.py --root output/ccrd-ocr-auto/candidate \
              --receipt output/ccrd-ocr-auto/publication.json \
              --metadata output/ccrd-ocr-auto/consumer/data/search_data.json.gz \
              --output output/ccrd-ocr-auto/acceptance.json
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ccrd-ocr-automatic-receipt
          path: |
            output/ccrd-ocr-auto/publication.json
            output/ccrd-ocr-auto/acceptance.json
            output/ccrd-ocr-auto/candidate/release-receipt.json
          if-no-files-found: warn
          retention-days: 30
  newspapers:
    if: github.repository == 'anftm/pipeline' && github.event_name == 'workflow_dispatch' && startsWith(inputs.release_path, 'https://') && !inputs.automatic
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      CCRD_OCR_WRITE_PROTOCOL: central-ccrd-ocr-publication-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Materialize the exact full candidate, stream readback and coherently rebase OCR
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          TRANSPORT_URL: ${{ inputs.release_path }}
          TRANSPORT_SHA256: ${{ inputs.release_sha256 }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python -u scripts/publish_ccrd_newspapers.py --transport-url "$TRANSPORT_URL" \
            --transport-sha256 "$TRANSPORT_SHA256" --root output/ccrd-newspapers \
            --output output/ccrd-newspapers-publication.json "${args[@]}"
      - name: Verify the exact production base, full metadata IDs, TXT and unchanged OCR IDs
        if: inputs.apply
        timeout-minutes: 45
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -u scripts/verify_ccrd_newspapers_live.py --root output/ccrd-newspapers \
            --receipt output/ccrd-newspapers-publication.json --output output/ccrd-newspapers-acceptance.json
      - name: Pin the accepted coherent OCR consumer after production acceptance
        if: inputs.apply
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -B scripts/pin_ccrd_newspaper_consumer.py \
            --publication output/ccrd-newspapers-publication.json \
            --acceptance output/ccrd-newspapers-acceptance.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ccrd-newspapers-publication-receipt
          path: |
            output/ccrd-newspapers-publication.json
            output/ccrd-newspapers-acceptance.json
            output/ccrd-newspapers/accepted-consumer.json
            output/ccrd-newspapers/ocr-rebase/release-receipt.json
          if-no-files-found: warn
          retention-days: 30
