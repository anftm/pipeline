name: Build Reader Assets

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: Exact source dataset, or blank for all
        required: false
        default: ""
        type: string
      extension:
        description: doc, docx, htm, html, mobi, azw3, chm, tif, tiff, djvu, or blank for all
        required: false
        default: ""
        type: string
      path:
        description: Exact source path within the dataset, or blank for all
        required: false
        default: ""
        type: string
      limit:
        description: Files per checkpoint
        required: true
        default: "20"
        type: string
      checkpoint_batches:
        description: Maximum checkpoints in this run
        required: true
        default: "30"
        type: string
      retry_failed:
        description: Retry current-profile failures
        required: false
        default: false
        type: boolean
      force:
        description: Rebuild even when the current asset is ready
        required: false
        default: false
        type: boolean
      dry_run:
        description: Scan only; do not download, convert, or publish
        required: false
        default: false
        type: boolean
      command_timeout:
        description: Per-command timeout in seconds
        required: false
        default: "120"
        type: string

concurrency:
  group: reader-assets
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt
      - name: Fetch current source metadata
        run: python scripts/fetch_and_parse.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
      - name: Scan incremental Reader Assets queue
        id: scan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: |
          args=(
            --repo "${{ inputs.repo || '' }}"
            --extension "${{ inputs.extension || '' }}"
            --path "${{ inputs.path || '' }}"
            --limit "${{ inputs.limit || '20' }}"
          )
          if [[ "${{ inputs.retry_failed }}" == "true" ]]; then args+=(--retry-failed); fi
          if [[ "${{ inputs.force }}" == "true" ]]; then args+=(--force); fi
          python scripts/scan_reader_assets.py "${args[@]}"
          python - <<'PY'
          import json, os
          queue = json.load(open("output/reader-assets/queue.json", encoding="utf-8"))
          items = queue["items"]
          extension = items[0]["extension"] if items else ""
          items = [item for item in items if item["extension"] == extension]
          queue["items"] = items
          json.dump(queue, open("output/reader-assets/queue.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"extension={extension}\n")
              output.write(f"count={len(items)}\n")
              output.write(f"stale_count={len(queue.get('stale_keys', []))}\n")
          PY
      - name: Install conversion tools
        if: inputs.dry_run != true && steps.scan.outputs.count != '0'
        env:
          EXTENSION: ${{ steps.scan.outputs.extension }}
        run: |
          packages=()
          case "${EXTENSION}" in
            doc|docx) packages=(libreoffice fontconfig fonts-noto-cjk fonts-wqy-microhei ghostscript poppler-utils tesseract-ocr tesseract-ocr-chi-sim) ;;
            htm|html) packages=() ;;
            mobi|azw3|chm) packages=(calibre) ;;
            djvu) packages=(djvulibre-bin poppler-utils) ;;
            tif|tiff) packages=(poppler-utils) ;;
            *) echo "Unsupported queued extension: ${EXTENSION}" >&2; exit 1 ;;
          esac
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          if [[ "${EXTENSION}" == "doc" || "${EXTENSION}" == "docx" ]]; then
            fc-cache -f
            fc-match -f '%{family}\n' 'SimSun:lang=zh-cn' | grep -E 'Noto|WenQuanYi'
          fi
      - name: Convert and checkpoint queue
        if: inputs.dry_run != true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
          READER_CONVERSION_COMMAND_TIMEOUT: ${{ inputs.command_timeout || '120' }}
          READER_CONVERSION_WORKERS: ${{ steps.scan.outputs.extension == 'djvu' && '2' || '1' }}
          EXTENSION: ${{ steps.scan.outputs.extension }}
          BATCH_SIZE: ${{ inputs.limit || '20' }}
          CHECKPOINT_BATCHES: ${{ inputs.checkpoint_batches || '30' }}
          SOURCE_REPO: ${{ inputs.repo || '' }}
          SOURCE_PATH: ${{ inputs.path || '' }}
          RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
          FORCE_REBUILD: ${{ inputs.force || 'false' }}
        run: |
          if [[ -z "${EXTENSION}" ]]; then
            if [[ "${{ steps.scan.outputs.stale_count }}" != "0" ]]; then
              python scripts/convert_reader_assets.py
              python scripts/publish_reader_assets.py
            fi
            exit 0
          fi
          max_batches="${CHECKPOINT_BATCHES}"
          if [[ "${RETRY_FAILED}" == "true" || "${FORCE_REBUILD}" == "true" || -n "${SOURCE_PATH}" ]]; then
            max_batches=1
          fi
          for ((batch=1; batch<=max_batches; batch++)); do
            if ((batch > 1)); then
              args=(--repo "${SOURCE_REPO}" --extension "${EXTENSION}" --limit "${BATCH_SIZE}")
              [[ "${RETRY_FAILED}" == "true" ]] && args+=(--retry-failed)
              [[ "${FORCE_REBUILD}" == "true" ]] && args+=(--force)
              python scripts/scan_reader_assets.py "${args[@]}"
            fi
            count=$(python -c 'import json; print(len(json.load(open("output/reader-assets/queue.json"))["items"]))')
            [[ "${count}" == "0" ]] && break
            echo "Checkpoint ${batch}/${max_batches}: ${count} ${EXTENSION} asset(s)"
            python scripts/convert_reader_assets.py
            python scripts/publish_reader_assets.py
          done
      - name: Publish sidecar to GitHub Pages
        if: inputs.dry_run != true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          READER_ASSETS_REPO: vomebook/Reader-Assets
        run: python scripts/publish_search_reader_index.py
      - name: Report dry-run queue
        if: inputs.dry_run == true
        run: python -m json.tool output/reader-assets/queue.json
