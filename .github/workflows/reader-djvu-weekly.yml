name: Reader/桶 · Weekly DJVU PDF Derivatives

on:
  schedule:
    - cron: "37 3 * * 0"
  workflow_dispatch:
    inputs:
      apply:
        description: Convert and publish pending DJVU derivatives
        required: true
        default: false
        type: boolean
      limit:
        description: Maximum DJVU sources; 0 means all pending
        required: true
        default: "0"
        type: string
      retry_failed:
        description: Retry checkpointed DJVU failures
        required: true
        default: true
        type: boolean
      repo:
        description: Exact source dataset, required for force rebuild
        required: false
        default: ""
        type: string
      path:
        description: Exact DJVU path within repo, required for force rebuild
        required: false
        default: ""
        type: string
      force:
        description: Force rebuild one exact source path
        required: true
        default: false
        type: boolean

concurrency:
  group: reader-sidecar
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Install DJVU conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends djvulibre-bin qpdf poppler-utils poppler-data fonts-noto-cjk fonts-liberation
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
        run: python scripts/fetch_and_parse.py
      - name: Convert pending DJVU derivatives
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--limit "${{ inputs.limit || '0' }}")
          if [[ -n "${{ inputs.repo || '' }}" || -n "${{ inputs.path || '' }}" ]]; then
            [[ -n "${{ inputs.repo || '' }}" && -n "${{ inputs.path || '' }}" ]] || exit 1
            args+=(--repo "${{ inputs.repo }}" --path "${{ inputs.path }}")
          fi
          if [[ "${{ inputs.force || 'false' }}" == "true" ]]; then
            [[ -n "${{ inputs.repo || '' }}" && -n "${{ inputs.path || '' }}" ]] || exit 1
            args+=(--force)
          fi
          if [[ "${{ inputs.apply || 'false' }}" == "true" || "${{ github.event_name }}" == "schedule" ]]; then args+=(--apply); fi
          if [[ "${{ inputs.retry_failed || 'true' }}" == "true" || "${{ github.event_name }}" == "schedule" ]]; then args+=(--retry-failed); fi
          python scripts/sync_djvu_pdf_derivatives.py "${args[@]}"
      - name: Rebuild canonical Reader sidecar
        if: github.event_name == 'schedule' || inputs.apply == true
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        if: github.event_name == 'schedule' || inputs.apply == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
