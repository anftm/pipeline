name: 运维 · Monthly Update Reminder

on:
  schedule:
    # 01:00 UTC on the first day of every month (09:00 China time).
    - cron: '0 1 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the reminder without sending email
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monthly-update-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify reminder contracts offline
        run: python -B -m unittest tests.test_monthly_reminder -v

      - name: Send monthly maintenance reminder
        env:
          DRY_RUN: ${{ inputs.dry_run || false }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SUBJECT_PREFIX: ${{ secrets.MAIL_SUBJECT_PREFIX }}
          BAIDU_UPSTREAM_1_URL: ${{ secrets.BAIDU_UPSTREAM_1_URL }}
          BAIDU_UPSTREAM_2_URL: ${{ secrets.BAIDU_UPSTREAM_2_URL }}
          MAOZEDONG_UPDATE_URL: ${{ secrets.MAOZEDONG_UPDATE_URL }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            python -B scripts/monthly_reminder.py --dry-run
          else
            python -B scripts/monthly_reminder.py
          fi
