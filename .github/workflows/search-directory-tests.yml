permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install search and workflow-test dependencies
        run: python -m pip install jieba==0.42.1 PyYAML==6.0.3 requests==2.32.5 boto3==1.43.123 huggingface_hub==1.33.0
      - name: Install pinned Reader conversion contracts
        run: python -m pip install -r scripts/requirements.txt
      - name: Exercise local Git and LFS, concurrency and source snapshots
        run: python -B -m unittest tests.test_search_directory_sync tests.test_fetch_and_parse tests.test_sync_auth tests.test_text_encoding_retirement tests.test_search_daily_journal tests.test_search_automation_workflows tests.test_search_daily_publish tests.test_search_reader_handoff tests.test_search_gc tests.test_search_gc_s3 tests.test_search_gc_roots tests.test_search_daily_resume_workflow tests.test_reader_format_daily tests.test_reader_format_daily_workflow tests.test_reader_format_workflow_automation tests.test_reader_format_backlog tests.test_reader_format_sources tests.test_reader_text_automation tests.test_pilot_epub_chapters tests.test_epub_toc tests.test_reader_ebook_rebuild tests.test_reader_ebook_rebuild_review tests.test_reader_ebook_rebuild_commit tests.test_reader_ebook_rebuild_archive tests.test_reader_ebook_rebuild_transport tests.test_reader_ebook_workflow_contract tests.test_reader_ebook_release_guard tests.test_reader_ebook_rebuild_recover tests.test_reader_ebook_recovery_inputs tests.test_reader_ebook_recovery_state tests.test_reader_ebook_canonical_guard tests.test_reader_stream_index tests.test_reader_kindle_native tests.test_plan_reader_stream_matrix tests.test_pilot_text_stream tests.test_reader_pages_release -v
      - name: Verify web typography and exact one-row replacement
        run: python -B -m unittest -v tests.test_web_typography tests.test_reader_web_exact_plan tests.test_reader_web_index_guard tests.test_reader_web_exact_publication tests.test_reader_web_batch_indexes tests.test_reader_web_managed_paths tests.test_reader_web_managed_avatar tests.test_reader_web_managed_convert tests.test_reader_web_profile_rollout tests.test_reader_web_profile_classification tests.test_reader_web_profile_publish tests.test_reader_web_profile_candidates tests.test_reader_web_retirement_backfill tests.test_reader_web_retention_plan
      - name: Verify image conversion, AVIF canary handoff and transparent GIF output
        run: python -B -m unittest -v tests.test_pilot_image_page_stream tests.test_reader_image_avif
      - name: Verify single-image migration and non-replay recovery
        run: python -B -m unittest discover -s tests -p 'test_reader_image_history*.py' -v
      - name: Exercise Space transition and rollback receipts
        run: python -B -m unittest -v tests.test_search_space_transition tests.test_search_space_deploy
      - name: Verify candidate Space build pin and Reader canary download bounds
        run: python -B -m unittest -v tests.test_search_space_build_workflow tests.test_reader_boost_downloads
      - name: Verify pinned source addition and first publication
        run: python -B -m unittest -v tests.test_search_source_additions tests.test_search_source_watch
      - name: Verify Reader maintenance, fences and timed deletion policy
        run: python -B -m unittest -v tests.test_reader_gc_activation tests.test_reader_gc_maintenance tests.test_reader_gc_graph tests.test_reader_gc_collect tests.test_chm_gc_terminal_guard tests.test_reader_maintenance_queue_contract
