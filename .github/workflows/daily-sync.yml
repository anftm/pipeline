name: Daily Sync

on:
  schedule:
    # Directory generation starts at 20:00 UTC and normally finishes within an hour.
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: Rebuild and publish even when source revisions are unchanged
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and parse
        id: fetch
        run: python scripts/fetch_and_parse.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: ${{ inputs.force_sync || 'false' }}

      - name: Sync to HF Space
        if: steps.fetch.outputs.data_changed == 'true'
        run: python scripts/sync_to_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Sync to GitHub Pages
        if: steps.fetch.outputs.data_changed == 'true'
        run: python scripts/sync_to_pages.py
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Deploy GitHub Pages
        if: steps.fetch.outputs.data_changed == 'true'
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${PAGES_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PAGES_REPO}/actions/workflows/static.yml/dispatches" \
            --data '{"ref":"main"}'

      - name: Commit updated state
        if: steps.fetch.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/commits.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update commit state [skip ci]"
            git push
          fi
