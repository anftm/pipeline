name: CHM terminal receipt and maintenance handoff inner
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'RELEASE-CHM-MAINTENANCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      GH_TOKEN: ${{ secrets.PDF_WORKER_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Test terminal receipt and restoration failure cases
        env:
          READER_GC_DURABLE_MAINTENANCE: 'false'
        run: python -B -m unittest tests.test_chm_terminal_release tests.test_reader_gc_maintenance tests.test_chm_remaining352_after_final20 -q
      - name: Verify all exact receipts and restore isolated producers
        run: python -u -B scripts/chm_terminal_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-terminal-maintenance-release
          path: output/chm-terminal-release/*
          retention-days: 90
          if-no-files-found: warn
