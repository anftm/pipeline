name: Publish source txt once

on:
  workflow_dispatch:

concurrency:
  group: publish-source-txt-once
  cancel-in-progress: false

jobs:
  publish-source-txt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs
          git lfs version
          pip install -r scripts/requirements.txt

      - name: Generate search data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/fetch_and_parse.py

      - name: Publish source txt files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME || 'VoiceOfML' }}
        run: python scripts/publish_source_txt_once.py
