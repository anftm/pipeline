name: Reader · Retire Exact OCR and PS Rebuild Objects

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RETIRE-2710 to confirm the reviewed OCR/PS inventory
        required: true
        type: string
      resume:
        description: Resume an interrupted run using its durable exact plan
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  retire:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RETIRE-2710'
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_CACHE: .cache/reader-gc/reads.sqlite3
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Test exact scope, graph, fences, and recovery offline
        env:
          READER_GC_DURABLE_MAINTENANCE: 'false'
        run: python -B -m unittest tests.test_expanded_ocr_retirement tests.test_run_expanded_ocr_retirement tests.test_ccrd_ocr_exact_retirement tests.test_reader_gc_graph tests.test_reader_gc_fence tests.test_reader_gc_maintenance tests.test_reader_gc_cache -q
      - uses: actions/cache/restore@v4
        with:
          path: .cache/reader-gc
          key: reader-gc-reads-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: reader-gc-reads-v1-
      - name: Isolate, verify actual closure, retire exact identities, and read back
        env:
          RESUME: ${{ inputs.resume }}
        run: python -u -B scripts/run_expanded_ocr_retirement.py
      - name: Restore producer isolation
        if: always()
        run: python -u -B scripts/reader_gc_maintenance.py restore --journal output/expanded-ocr-retirement/maintenance.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/reader-gc
          key: reader-gc-reads-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: expanded-ocr-retirement
          path: output/expanded-ocr-retirement/*.json
          retention-days: 90
          if-no-files-found: warn
