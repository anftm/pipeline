name: Reader · Verify Interrupted Single CHM (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-sidecar
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Verify fail-closed preflight contracts
        run: python -B -m unittest tests.test_chm_single_interrupted_preflight -v
      - name: Check exact interrupted CHM and both live projections without writing
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/chm_single_interrupted_preflight.py
