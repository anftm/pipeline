name: Submit proofreading

on:
  workflow_dispatch:
    inputs:
      archive_id:
        description: Archive number, 0-31
        required: true
        type: string
      kind:
        description: proofread, ocr_patch, or config
        required: true
        default: proofread
        type: string
      article_id:
        description: Article ID for ocr_patch
        required: false
        type: string
      publication_id:
        description: Publication ID for ocr_patch
        required: false
        type: string
      patch_json:
        description: JSON patch object for ocr_patch
        required: false
        type: string
      path:
        description: Path inside archivesN for config
        required: false
        type: string
      content:
        description: Complete config file content for config
        required: false
        type: string
      metadata_json:
        description: Structured metadata correction JSON for config
        required: false
        type: string
      title:
        description: Pull request title
        required: false
        default: Proofreading correction
        type: string
      description:
        description: Pull request description
        required: false
        type: string
  repository_dispatch:
    types: [submit-proofread]

permissions:
  contents: write
  pull-requests: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Create proofreading pull request
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python3 scripts/submit_proofread.py
