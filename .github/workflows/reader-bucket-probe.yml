name: Reader/桶 · Verify Single-Object Conditions
run-name: Reader bucket conditional probe / ${{ inputs.apply && 'one disposable key' || 'dry run' }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Conditionally create and delete exactly one random probe object
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: reader-bucket-probe
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned probe dependencies
        run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Exercise probe boundaries and uncertain outcomes
        run: python -B -m unittest -v tests.test_reader_bucket_probe
      - name: Inspect or test exactly one isolated key
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [[ "$APPLY" == true ]]; then
            python -B scripts/reader_bucket_probe.py --apply
          else
            python -B scripts/reader_bucket_probe.py
          fi
