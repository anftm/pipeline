name: Force OCR exact book

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Exact source repository
        required: true
        default: VoiceOfML/MLMRL-Library
        type: string
      source_path:
        description: Exact source path (without the NUL key separator)
        required: true
        type: string
      source_sha256:
        description: Expected SHA-256 of the published PDF
        required: true
        type: string
      ocr_language:
        description: Recognition language for this book
        required: true
        default: auto
        type: choice
        options: [auto, ch, en]
      layout_rotation:
        description: No-op rotation recorded in the forced layout profile
        required: true
        default: "0"
        type: choice
        options: ["0", "90", "180", "270"]
      mode:
        description: Render and publish OCR, or promote the current OCR text
        required: true
        default: render-ocr
        type: choice
        options: [render-ocr, promote]
      expected_parent:
        description: Expected current Reader catalog generation (promote only)
        required: false
        default: none
        type: string
      apply:
        description: Write changes. Leave false for a read-only plan.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: force-ocr-${{ inputs.source_repo }}-${{ inputs.source_sha256 }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  force:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      PDF_OCR_LANG: auto
      PDF_OCR_BACKEND: rapidocr_onnxruntime
      SOURCE_REPO: ${{ inputs.source_repo }}
      SOURCE_PATH: ${{ inputs.source_path }}
      SOURCE_SHA256: ${{ inputs.source_sha256 }}
      OCR_LANGUAGE: ${{ inputs.ocr_language }}
      LAYOUT_ROTATION: ${{ inputs.layout_rotation }}
      FORCE_MODE: ${{ inputs.mode }}
      EXPECTED_PARENT: ${{ inputs.expected_parent }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils poppler-data fonts-noto-cjk fonts-liberation
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt -r scripts/requirements-pdf-ocr.txt
      - name: Render, OCR and publish, or promote
        shell: bash
        run: |
          set -euo pipefail
          APPLY=()
          if [ "${{ inputs.apply }}" = "true" ]; then
            APPLY=(--apply)
          fi
          python scripts/force_ocr_book.py \
            --source-repo "$SOURCE_REPO" \
            --source-path "$SOURCE_PATH" \
            --expected-sha256 "$SOURCE_SHA256" \
            --ocr-language "$OCR_LANGUAGE" \
            --layout-rotation "$LAYOUT_ROTATION" \
            --mode "$FORCE_MODE" \
            --expected-parent "$EXPECTED_PARENT" \
            "${APPLY[@]}"
