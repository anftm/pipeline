name: Publish CCRD Index

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Check CCRD source hash
        id: source
        run: python scripts/check_ccrd_source_changed.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Build and publish CCRD indexes
        if: steps.source.outputs.changed == 'true'
        run: python scripts/publish_ccrd_index.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Update CCRD source text and trigger Space rebuild
        if: steps.source.outputs.changed == 'true'
        run: python scripts/update_ccrd_source_txt.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME || 'VoiceOfML' }}
