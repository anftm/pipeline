name: CHM terminal GC release proof inner
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  release:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'VERIFY-CHM-GC-RELEASE'
    runs-on: ubuntu-24.04
    timeout-minutes: 440
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    env:
      READER_GC_DURABLE_MAINTENANCE: 'true'
      READER_GC_S3_RATE: '6'
      READER_S3_LIST_WORKERS: '4'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
      GH_TOKEN: ${{ secrets.PDF_WORKER_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Test release proof, isolation, journal and collector guard
        env:
          READER_GC_DURABLE_MAINTENANCE: 'false'
        run: >-
          python -B -m unittest tests.test_reader_gc_credentials tests.test_chm_gc_terminal_model tests.test_chm_gc_terminal_guard
          tests.test_publish_chm_gc_release tests.test_reader_gc_chm_window tests.test_reader_gc_maintenance
          tests.test_reader_gc_fence tests.test_reader_gc_graph tests.test_reader_gc_collect
          tests.test_reader_gc_documents tests.test_reader_gc_inputs tests.test_reader_gc_ccrd -q
      - name: Verify terminal release in an isolated maintenance window
        run: python -u -B scripts/publish_chm_gc_release.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chm-gc-release-proof
          path: output/chm-gc-release/*
          retention-days: 90
          if-no-files-found: warn
