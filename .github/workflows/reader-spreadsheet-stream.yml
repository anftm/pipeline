name: Reader/桶 · Build Spreadsheet Streams
run-name: Spreadsheet streams ${{ (github.event_name == 'schedule' || inputs.apply == true) && 'apply' || 'plan' }} (${{ inputs.extension || 'all' }})

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
    inputs:
      extension:
        description: Spreadsheet format, or all
        required: true
        default: all
        type: choice
        options: [all, xls, xlsx, csv, ods]
      limit:
        description: Maximum sources; 0 means all pending
        required: true
        default: "0"
        type: string
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean
      apply:
        description: Convert and publish spreadsheet streams
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-spreadsheet
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan pending spreadsheet workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          args=(--kind spreadsheet --extension "${{ inputs.extension || 'all' }}" --output output/spreadsheet-matrix.json --report output/spreadsheet-report.json)
          if [[ "${{ inputs.retry_failures }}" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/spreadsheet-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/spreadsheet-plan.tgz output/search_data.json state/commits.json output/spreadsheet-matrix.json output/spreadsheet-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-spreadsheet-plan
          path: output/spreadsheet-plan.tgz
          retention-days: 1

  spreadsheet-stream:
    needs: plan
    if: >-
      (github.event_name == 'schedule' || inputs.apply == true) &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install spreadsheet tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc python3-uno fontconfig fonts-noto-cjk fonts-wqy-microhei
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reader-spreadsheet-plan
          path: output
      - run: tar -xzf output/spreadsheet-plan.tgz
      - name: Build and publish spreadsheet streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_CONVERSION_PASSWORD: ${{ secrets.READER_CONVERSION_PASSWORD }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--extension "${{ matrix.extension }}" --limit "${{ inputs.limit || '0' }}" --apply --strict)
          if [[ "${{ inputs.retry_failures }}" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_spreadsheet_stream.py "${args[@]}"

  finalize:
    needs: [plan, spreadsheet-stream]
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name == 'schedule' || inputs.apply == true) &&
      (needs.spreadsheet-stream.result == 'success' || needs.spreadsheet-stream.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
