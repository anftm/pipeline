name: Daily Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pipeline repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch and parse
        id: fetch
        run: python scripts/fetch_and_parse.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Check if new data generated
        id: check
        run: |
          if [ -f output/search_data.json ]; then
            echo "data_changed=true" >> $GITHUB_OUTPUT
          else
            echo "data_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Sync to HF Space
        if: steps.check.outputs.data_changed == 'true'
        run: python scripts/sync_to_space.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Sync to GitHub Pages
        if: steps.check.outputs.data_changed == 'true'
        run: python scripts/sync_to_pages.py
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Commit updated state
        if: steps.check.outputs.data_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/commits.json
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update commit state [skip ci]"
            git push
          fi
