name: Schedule PDF Health Audit

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch only when the audit worker is idle
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs=$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${REPO}/actions/workflows/pdf-health-worker.yml/runs?per_page=20")
          active=$(printf '%s' "${runs}" | jq '[.workflow_runs[] | select(.status == "queued" or .status == "in_progress")] | length')
          if ((active > 0)); then exit 0; fi
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" --data '{"ref":"main"}' "https://api.github.com/repos/${REPO}/actions/workflows/pdf-health-worker.yml/dispatches"
