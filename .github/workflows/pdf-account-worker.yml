name: Retired document worker sentinel

# This path is still an inventory sentinel for producer fences and historical
# runs. It must never dispatch, access a bucket, or execute processing jobs.
# Its existence is not evidence that external writers are isolated.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: exit 1
