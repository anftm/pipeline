name: CCRD · Monitor Four-Source Text

on:
  # Monitoring reads the source, current manifest and consumer; it is not a
  # publisher and never replaces the four-source generation.
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Compare upstream text and actual four-source consumer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/check_ccrd_four_source.py --output output/ccrd/four-source-check.json
      - uses: actions/upload-artifact@v7
        with:
          name: ccrd-four-source-check
          path: output/ccrd/four-source-check.json
          retention-days: 30
          if-no-files-found: error
