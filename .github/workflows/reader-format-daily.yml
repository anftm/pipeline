name: Reader/桶 · Daily Format Conversion
run-name: ${{ inputs.search_source_run && format('reader-search-handoff/{0}', inputs.search_source_run) || inputs.continuation_id && format('reader-format-continuation/{0}', inputs.continuation_id) || format('Reader format backlog / {0}', github.event_name) }}

on:
  # Recheck conversion rules even when Search has not published changed data.
  # This is an independent, default-off cadence; Search-triggered runs are unchanged.
  schedule:
    - cron: '43 6 * * *'
  workflow_run:
    workflows: ['搜索 · Daily Sync', '搜索 · Resume Daily Publication']
    types: [completed]
  workflow_dispatch:
    inputs:
      search_source_run:
        description: Exact bot Search source run; only accepted with its published receipt
        type: string
        default: ''
      continuation_run_id:
        description: Previous successful run with a fully verified continuation result
        type: string
        default: ''
      continuation_id:
        description: Exact continuation ID recorded by the previous run
        type: string
        default: ''
      apply:
        description: Process every triggered format through verified Reader publication
        type: boolean
        default: false
      known_writers_coordinated:
        description: Known Reader producers and external writers are coordinated
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
concurrency:
  group: reader-format-daily
  cancel-in-progress: false
  queue: max
jobs:
  formats:
    if: >-
      github.repository == 'anftm/pipeline' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.READER_FORMAT_RECHECK_ENABLED == 'true' &&
        vars.READER_FORMAT_AUTOMATION_ENABLED == 'true' && vars.READER_V3_AUTO_PAUSED != 'true') ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
        !(github.event.workflow_run.path == '.github/workflows/search-daily-sync.yml' && github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.actor.login == 'github-actions[bot]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      READER_AUTOMATION_ENABLED: ${{ vars.READER_FORMAT_AUTOMATION_ENABLED }}
      READER_PAUSED: ${{ vars.READER_V3_AUTO_PAUSED }}
      READER_CHM_PROFILE_REBUILD_ENABLED: ${{ vars.READER_CHM_PROFILE_REBUILD_ENABLED }}
      REQUESTED_APPLY: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.search_source_run != '') || inputs.apply }}
      WRITERS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.search_source_run != '') || inputs.known_writers_coordinated }}
      EXPLICIT_SEARCH_HANDOFF: ${{ github.event_name == 'workflow_dispatch' && inputs.search_source_run != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify current code and successful source sync
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ github.event.workflow_run.id }}
          SOURCE_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_run ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT/jobs?per_page=100" > "$RUNNER_TEMP/source-jobs.json"
            python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-jobs.json').read_text())
          jobs = data.get('jobs')
          if not isinstance(jobs, list) or data.get('total_count') != len(jobs):
              raise SystemExit('Incomplete source job observation')
          expected_job = {'搜索 · Daily Sync': 'sync', '搜索 · Resume Daily Publication': 'resume'}.get(os.environ['SOURCE_WORKFLOW'])
          sync = [job for job in jobs if job.get('name') == expected_job]
          if expected_job is None or len(sync) != 1 or sync[0].get('conclusion') != 'success':
              raise SystemExit('A successful full search sync is required; directory-only runs cannot trigger conversion')
          PY
          fi
      - name: Install pinned dependencies
        run: pip install -r scripts/requirements.txt requests==2.32.5 PyYAML==6.0.3
      - name: Verify format automation contracts
        run: python -B -m unittest -v tests.test_reader_format_backlog tests.test_reader_format_daily tests.test_reader_format_workflow_automation tests.test_reader_format_daily_workflow tests.test_reader_format_sources tests.test_reader_text_automation tests.test_search_reader_handoff
      - name: Verify explicit bot Search handoff
        if: env.EXPLICIT_SEARCH_HANDOFF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          SOURCE_RUN: ${{ inputs.search_source_run }}
          CONTINUATION_RUN: ${{ inputs.continuation_run_id }}
          CONTINUATION_ID: ${{ inputs.continuation_id }}
          MANUAL_APPLY: ${{ inputs.apply }}
          MANUAL_WRITERS: ${{ inputs.known_writers_coordinated }}
        run: |
          set -euo pipefail
          [[ -z "$CONTINUATION_RUN" && -z "$CONTINUATION_ID" && "$MANUAL_APPLY" == false && "$MANUAL_WRITERS" == false ]]
          [[ "$READER_AUTOMATION_ENABLED" == true && "$READER_PAUSED" != true ]]
          python -B -m scripts.search_reader_handoff verify
      - name: Observe exact published format backlog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          threshold=$(python -c 'from scripts.reader_format_daily import THRESHOLD; print(THRESHOLD)')
          python -B scripts/reader_format_backlog.py --threshold "$threshold" \
            --output output/format-daily/summary.json --epub-details output/format-daily/epub-details.json
          if [[ "$EXPLICIT_SEARCH_HANDOFF" == 'true' ]]; then
            python -B -m scripts.search_reader_handoff check-backlog
          fi
          python -B scripts/reader_format_daily.py plan --summary output/format-daily/summary.json \
            --output output/format-daily/decision.json
      - name: Convert and publish triggered formats to completion
        id: convert
        if: env.REQUESTED_APPLY == 'true' && env.READER_AUTOMATION_ENABLED == 'true' && env.READER_PAUSED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CONTINUATION_RUN_ID: ${{ inputs.continuation_run_id }}
          CONTINUATION_ID: ${{ inputs.continuation_id }}
        run: |
          set -euo pipefail
          [[ "$WRITERS" == true ]]
          args=(run --summary output/format-daily/summary.json --output output/format-daily/result.json
                --journal output/format-daily/operations.jsonl --expected-sha "$GITHUB_SHA"
                --enabled --known-writers-verified --max-batches 20 --timeout-seconds 18000)
          if [[ -n "$CONTINUATION_RUN_ID" || -n "$CONTINUATION_ID" ]]; then
            args+=(--continuation-run-id "$CONTINUATION_RUN_ID" --continuation-id "$CONTINUATION_ID")
          fi
          python -B scripts/reader_format_daily.py "${args[@]}"
          status=$(python -c 'import json; print(json.load(open("output/format-daily/result.json"))["status"])')
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Preserve exact decisions and operation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reader-format-daily-${{ github.run_id }}
          path: output/format-daily/
          if-no-files-found: warn
          retention-days: 14
      - name: Queue verified continuation after publishing its evidence
        if: steps.convert.outputs.status == 'continuation_required'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -B scripts/reader_format_daily.py continue-dispatch \
            --result output/format-daily/result.json --journal output/format-continuation-dispatch.json \
            --output output/format-continuation-result.json --expected-sha "$GITHUB_SHA" \
            --enabled --known-writers-verified
      - name: Preserve continuation dispatch outcome
        if: always() && steps.convert.outputs.status == 'continuation_required'
        uses: actions/upload-artifact@v7
        with:
          name: reader-format-continuation-${{ github.run_id }}
          path: output/format-continuation-*.json
          if-no-files-found: warn
          retention-days: 14
