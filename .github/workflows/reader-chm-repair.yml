name: Reader/桶 · Rebuild CHM Chapter Streams
run-name: ${{ inputs.automation_id && format('reader-auto/{0}', inputs.automation_id) || format('CHM source-text repair / {0}', inputs.apply == true && 'apply' || 'plan') }}

on:
  # The full CHM EPUB stays retired. Resume only chapter conversion, manually.
  workflow_dispatch:
    inputs:
      automation_id:
        description: Optional controller correlation ID (32 lowercase hex characters)
        required: false
        default: ""
        type: string
      search_generation:
        description: Published search generation for the automatic batch (64 lowercase hex)
        required: false
        default: ""
        type: string
      expected_sha:
        description: Controller pipeline main commit (40 lowercase hex)
        required: false
        default: ""
        type: string
      defer_unify:
        description: Let the controller unify and verify after canonical indexes and sidecar finish
        required: false
        default: false
        type: boolean
      limit:
        description: Maximum CHM attempts in this batch (1-5)
        required: true
        default: "1"
        type: string
      apply:
        description: Convert and publish; false only reports the pending queue
        required: true
        default: false
        type: boolean
      retry_failed:
        description: Explicitly retry sources that failed the v9 conversion
        required: true
        default: false
        type: boolean
      failed_only:
        description: Retry only the previous failure checkpoint, not the old-profile queue
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  plan:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - &automation-gate
        name: Validate automation and current main
        env:
          AUTOMATION_ID: ${{ inputs.automation_id }}
          AUTOMATION_ENABLED: ${{ vars.READER_FORMAT_AUTOMATION_ENABLED }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEFER_UNIFY: ${{ inputs.defer_unify }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$AUTOMATION_ID$SEARCH_GENERATION$EXPECTED_SHA" && "$DEFER_UNIFY" != 'true' ]]; then exit 0; fi
          [[ "$SEARCH_GENERATION" =~ ^[0-9a-f]{64}$ && "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$DEFER_UNIFY" == 'true' ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$AUTOMATION_ID" =~ ^[0-9a-f]{32}$ ]] || { echo 'automation_id must be 32 lowercase hex characters' >&2; exit 1; }
          [[ "$AUTOMATION_ENABLED" == 'true' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/reader-chm-repair.yml@refs/heads/main" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          local_sha=$(git rev-parse HEAD)
          [[ "$local_sha" == "$GITHUB_SHA" ]]
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$remote_sha" == "$GITHUB_SHA" ]]
      - name: Fetch pinned CHM source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: "true"
        run: python scripts/fetch_and_parse.py
      - &source-guard
        name: Bind automatic batch to published search sources
        if: inputs.automation_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SEARCH_GENERATION: ${{ inputs.search_generation }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python scripts/reader_format_daily.py guard-source \
            --generation "$SEARCH_GENERATION" --expected-sha "$EXPECTED_SHA" \
            --revisions state/commits.json
      - name: Plan only sources on the old CHM chapter profile
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIMIT: ${{ inputs.limit || '1' }}
          RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
          FAILED_ONLY: ${{ inputs.failed_only || 'false' }}
        run: |
          [[ "$LIMIT" =~ ^[1-5]$ ]] || { echo 'limit must be 1-5' >&2; exit 1; }
          args=(--extension chm --limit "$LIMIT" --shard-count 1 --shard-index 0 --plan-only)
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failures); fi
          if [[ "$FAILED_ONLY" == "true" ]]; then args+=(--failed-only); fi
          report=$(python scripts/pilot_epub_chapters.py "${args[@]}")
          echo "$report"
          mkdir -p output
          printf '%s\n' "$report" > output/chm-plan.json
          count=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["selected"])' "$report")
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Preserve the pinned source snapshot for the conversion run
        run: tar -czf output/chm-source-snapshot.tgz output/search_data.json state/commits.json output/chm-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: chm-source-snapshot
          path: output/chm-source-snapshot.tgz
          retention-days: 1
          if-no-files-found: error

  rebuild:
    needs: plan
    if: inputs.apply == true && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre p7zip-full
      - uses: actions/download-artifact@v8
        with:
          name: chm-source-snapshot
          path: output
      - run: tar -xzf output/chm-source-snapshot.tgz
      - *automation-gate
      - *source-guard
      - name: Build chapter streams from pinned CHMs (EPUB is temporary)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_CHM_COMMAND_TIMEOUT: "1800"
          READER_CONVERSION_WORKERS: "2"
          LIMIT: ${{ inputs.limit || '1' }}
          RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
          FAILED_ONLY: ${{ inputs.failed_only || 'false' }}
        run: |
          [[ "$LIMIT" =~ ^[1-5]$ ]] || { echo 'limit must be 1-5' >&2; exit 1; }
          args=(--extension chm --limit "$LIMIT" --shard-count 1 --shard-index 0 --apply --workers 2 --strict)
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failures); fi
          if [[ "$FAILED_ONLY" == "true" ]]; then args+=(--failed-only); fi
          python scripts/pilot_epub_chapters.py "${args[@]}"
      - name: Rebuild the canonical Reader sidecar and release handed-off roots
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify the updated Reader projection
        if: inputs.defer_unify != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f operation=unify -f apply=true
