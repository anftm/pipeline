name: Reader/桶 · Publish v3 Reading Generation
run-name: ${{ inputs.automation_id && format('reader-auto/{0}', inputs.automation_id) || format('v3 {0} / {1}', inputs.operation || github.event_name, (inputs.apply || github.event_name != 'workflow_dispatch') && 'apply' || 'verify') }}

on:
  # Retirement is an explicit operation: restoring the publisher must not
  # automatically advance old GC/retirement journals on a schedule.
  workflow_dispatch:
    inputs:
      automation_id:
        description: Optional exact format automation operation ID
        type: string
        default: ''
      operation:
        type: choice
        options: [inspect, unify, ack, retire, withdraw, reset-documents, remove-route, restore-route, verify-route, migrate-derived, resume-derived, redirect-derived, finalize-derived-redirects, replace-derived-history, replace-exact-web, verify-exact-web, replace-managed-web, verify-managed-web, prepare-managed-web, upgrade-web-profile, record-web-retirement-hints, verify-exact-office-report, replace-exact-office-report, prepare-exact-ebook, replace-exact-ebook, recover-exact-ebook, refresh-reader-consumers, reconcile-derived-index, reconcile-sidecar, compact-legacy-history, publish-generation, verify-generation, verify-pages-lane]
        default: inspect
      resource_json:
        description: 'Migration requires root identities; optional read-only check_s3=true; apply/resume require external_writers_stopped=true'
        type: string
        default: '{}'
      recovery_phase:
        description: Exact EPUB recovery step; inspect never writes
        type: choice
        options: [inspect, canonical, legacy-start, legacy-resume, v3, pages]
        default: inspect
      expected_parent:
        description: Expected current v3 generation for withdrawal or route operation
        type: string
        default: none
      surface:
        type: choice
        options: [hf, pages]
        default: hf
      apply:
        description: Apply after complete validation under the central writer lock
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-sidecar
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    # Do not race the search publication's exact Pages/default observations.
    concurrency:
      group: daily-sync
      cancel-in-progress: false
      queue: max
    if: >-
      github.repository == 'anftm/pipeline' &&
      (vars.READER_V3_AUTO_PAUSED != 'true' ||
       (github.event_name == 'workflow_dispatch' && inputs.operation != 'auto'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      READER_V3_WRITE_PROTOCOL: central-reader-sidecar-v3-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.operation == 'upgrade-web-profile' && '3.12' || '3.11' }}
      - run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Guard automatic format publication
        if: inputs.automation_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AUTOMATION_ID: ${{ inputs.automation_id }}
          ENABLED: ${{ vars.READER_FORMAT_AUTOMATION_ENABLED }}
          OPERATION: ${{ inputs.operation }}
          APPLY: ${{ inputs.apply }}
          WEB_PROFILE_ENABLED: ${{ vars.READER_WEB_PROFILE_REBUILD_ENABLED }}
        run: |
          set -euo pipefail
          [[ "$AUTOMATION_ID" =~ ^[0-9a-f]{32}$ && "$ENABLED" == true ]]
          [[ "$APPLY" == true ]]
          [[ "$OPERATION" == unify || ( "$OPERATION" == upgrade-web-profile && "$WEB_PROFILE_ENABLED" == true ) ]]
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
      - name: Guard original document and legacy reference contracts
        run: python -m unittest tests.test_direct_document_policy tests.test_reader_storage_contract
      - name: Test page migration and fence
        if: contains(fromJSON('["migrate-derived","resume-derived","redirect-derived","reconcile-derived-index","reconcile-sidecar","compact-legacy-history","unify","remove-route","restore-route"]'), inputs.operation)
        run: python -m unittest tests.test_reader_page_audit tests.test_reader_page_cas tests.test_reader_page_s3_preview tests.test_reader_page_migrate tests.test_reader_page_migration_fence tests.test_reader_page_atomic tests.test_reader_page_refresh tests.test_reader_page_reconcile tests.test_reader_sidecar_reconcile tests.test_reader_legacy_compact
      - name: Test completed PDF redirect finalization
        if: inputs.operation == 'finalize-derived-redirects'
        run: python -B -m unittest tests.test_reader_page_redirect_retirement
      - name: Test exact PDF history replacement
        if: inputs.operation == 'replace-derived-history'
        run: python -B -m unittest tests.test_reader_page_history_inventory tests.test_reader_page_history_replacement tests.test_reader_page_history_publish tests.test_reader_page_history_store
      - name: Test exact web replacement
        if: inputs.operation == 'replace-exact-web' || inputs.operation == 'verify-exact-web'
        run: python -B -m unittest tests.test_reader_mht_s3_preflight tests.test_reader_web_exact_plan tests.test_reader_web_index_guard tests.test_reader_web_exact_publication tests.test_reader_image_history_catalog tests.test_reader_image_history_publish tests.test_reader_image_history_v3
      - name: Test managed web replacement and preflight
        if: contains(fromJSON('["replace-managed-web","verify-managed-web"]'), inputs.operation)
        run: python -B -m unittest tests.test_reader_web_batch_indexes tests.test_reader_web_index_guard tests.test_reader_web_exact_publication tests.test_reader_image_history_catalog
      - name: Test managed web preparation and release gate
        if: contains(fromJSON('["prepare-managed-web","verify-managed-web","replace-managed-web"]'), inputs.operation)
        run: python -B -m unittest tests.test_reader_web_managed_paths
      - name: Test exact Office report preflight
        if: inputs.operation == 'verify-exact-office-report' || inputs.operation == 'replace-exact-office-report'
        run: python -B -m unittest tests.test_reader_exact_office_plan tests.test_reader_image_history_store tests.test_reader_image_history_catalog tests.test_reader_image_history_publish tests.test_reader_image_history_v3
      - name: Test scoped Reader consumer root refresh
        if: inputs.operation == 'refresh-reader-consumers'
        run: python -B -m unittest tests.test_reader_page_consumer_refresh tests.test_reader_page_consumer_store
      - name: Install pinned Chromium for Web Reader acceptance
        if: contains(fromJSON('["upgrade-web-profile","prepare-managed-web","verify-managed-web","replace-managed-web"]'), inputs.operation)
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium --only-shell
      - name: Verify or record exact historical Web retirement hints
        if: inputs.operation == 'record-web-retirement-hints'
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ inputs.apply && secrets.HF_S3_ACCESS_KEY_ID || '' }}
          HF_S3_SECRET_ACCESS_KEY: ${{ inputs.apply && secrets.HF_S3_SECRET_ACCESS_KEY || '' }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          mkdir -p output/v3
          args=()
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python -B -m unittest tests.test_reader_web_retirement_backfill tests.test_reader_web_retention_plan
          python -B -m scripts.reader_web_retirement_backfill --resource-json "$RESOURCE_JSON" \
            --output output/v3/web-retirement-hints.json "${args[@]}"
      - name: Prepare or publish exact same-source EPUB candidates
        if: contains(fromJSON('["prepare-exact-ebook","replace-exact-ebook","recover-exact-ebook"]'), inputs.operation)
        env:
          OPERATION: ${{ inputs.operation }}
          APPLY: ${{ inputs.apply }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          RECOVERY_PHASE: ${{ inputs.recovery_phase }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_WEB_PAGES_PROOF_TOKEN: ${{ secrets.READER_PAGES_DISPATCH_TOKEN }}
          READER_PAGES_DISPATCH_TOKEN: ${{ (inputs.operation == 'replace-exact-ebook' || (inputs.operation == 'recover-exact-ebook' && inputs.recovery_phase == 'pages')) && secrets.READER_PAGES_DISPATCH_TOKEN || '' }}
          READER_PAGES_EXACT_ENABLED: ${{ vars.READER_PAGES_EXACT_ENABLED }}
          READER_EBOOK_PUBLISH_ENABLED: ${{ vars.READER_EBOOK_PUBLISH_ENABLED }}
          READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED: ${{ vars.READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED }}
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
          GC_CENTRAL_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          # Read the public Git ref directly; this exact checkout gate does not need
          # an Actions installation API request or a cached local tracking ref.
          main=$(GIT_TERMINAL_PROMPT=0 timeout 30s git -c http.extraHeader= -c http.https://github.com/.extraheader= -c credential.helper= ls-remote --exit-code https://github.com/anftm/pipeline.git refs/heads/main)
          [[ "$main" == "$GITHUB_SHA"$'\trefs/heads/main' ]] || { echo 'Exact EPUB workflow: Pipeline main moved' >&2; exit 1; }
          python -B -m unittest tests.test_reader_ebook_rebuild_archive tests.test_reader_ebook_canonical_guard tests.test_reader_ebook_rebuild_transport tests.test_reader_ebook_rebuild_commit tests.test_reader_ebook_recovery_inputs tests.test_reader_ebook_recovery_state tests.test_reader_ebook_rebuild_recover
          mkdir -p output/v3
          if [[ "$OPERATION" == prepare-exact-ebook ]]; then
            [[ "$APPLY" == false && "$RECOVERY_PHASE" == inspect ]]
            python -B -m scripts.reader_ebook_rebuild_publish --resource-json "$RESOURCE_JSON" --output output/v3/ebook-review.json
          elif [[ "$OPERATION" == recover-exact-ebook ]]; then
            if [[ "$RECOVERY_PHASE" == inspect ]]; then
              [[ "$APPLY" == false ]]
            else
              [[ "$READER_EBOOK_PUBLISH_ENABLED" == true && "$READER_PAGES_EXACT_ENABLED" == true && "$READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED" == true ]]
              [[ "$RECOVERY_PHASE" == pages || "$APPLY" == true ]]
            fi
            python -B -m scripts.reader_ebook_rebuild_publish --recover "$RECOVERY_PHASE" --resource-json "$RESOURCE_JSON" --output output/v3/ebook-recovery.json
            if [[ "$RECOVERY_PHASE" == pages ]]; then
              observe=()
              if [[ "$APPLY" == false ]]; then observe+=(--observe-only); fi
              python -B -m scripts.reader_pages_release --publication output/v3/ebook-recovery.json --output output/v3/pages-release.json "${observe[@]}"
            fi
          else
            [[ "$RECOVERY_PHASE" == inspect ]]
            [[ "$APPLY" == true && "$READER_EBOOK_PUBLISH_ENABLED" == true && "$READER_PAGES_EXACT_ENABLED" == true ]]
            [[ "$READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED" == true && -n "$GC_CENTRAL_TOKEN" ]]
            python -B -m scripts.reader_pages_release --preflight
            python -B -m scripts.reader_ebook_rebuild_publish --apply --resource-json "$RESOURCE_JSON" --output output/v3/publication.json
            python -B -m scripts.reader_pages_release --publication output/v3/publication.json --output output/v3/pages-release.json
            generation=$(jq -er '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" --wait-seconds 1200 \
              --output output/v3/ebook-verification.json
          fi
      - name: Verify and execute the central v3 operation
        id: operation
        if: inputs.operation != 'record-web-retirement-hints' && inputs.operation != 'prepare-exact-ebook' && inputs.operation != 'replace-exact-ebook' && inputs.operation != 'recover-exact-ebook'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ (contains(fromJSON('["migrate-derived","resume-derived","redirect-derived","finalize-derived-redirects","replace-derived-history","replace-exact-web","verify-exact-web","replace-managed-web","verify-managed-web","prepare-managed-web","upgrade-web-profile","verify-exact-office-report","replace-exact-office-report","refresh-reader-consumers","reconcile-derived-index","reconcile-sidecar","compact-legacy-history","unify","remove-route","restore-route"]'), inputs.operation) || (vars.READER_PAGES_EXACT_ENABLED == 'true' && inputs.apply && inputs.operation == 'publish-generation') || (inputs.operation == 'verify-pages-lane' && !inputs.apply)) && secrets.HF_S3_ACCESS_KEY_ID || '' }}
          HF_S3_SECRET_ACCESS_KEY: ${{ (contains(fromJSON('["migrate-derived","resume-derived","redirect-derived","finalize-derived-redirects","replace-derived-history","replace-exact-web","verify-exact-web","replace-managed-web","verify-managed-web","prepare-managed-web","upgrade-web-profile","verify-exact-office-report","replace-exact-office-report","refresh-reader-consumers","reconcile-derived-index","reconcile-sidecar","compact-legacy-history","unify","remove-route","restore-route"]'), inputs.operation) || (vars.READER_PAGES_EXACT_ENABLED == 'true' && inputs.apply && inputs.operation == 'publish-generation') || (inputs.operation == 'verify-pages-lane' && !inputs.apply)) && secrets.HF_S3_SECRET_ACCESS_KEY || '' }}
          GH_TOKEN: ${{ github.token }}
          GC_CENTRAL_TOKEN: ${{ (inputs.operation == 'replace-exact-web' || inputs.operation == 'replace-managed-web' || inputs.operation == 'replace-exact-office-report') && github.token || '' }}
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
          READER_PAGES_DISPATCH_TOKEN: ${{ ((vars.READER_PAGES_EXACT_ENABLED == 'true' && inputs.apply && contains(fromJSON('["unify","publish-generation","replace-exact-web","replace-managed-web","replace-exact-office-report","upgrade-web-profile"]'), inputs.operation)) || (inputs.operation == 'verify-pages-lane' && !inputs.apply)) && secrets.READER_PAGES_DISPATCH_TOKEN || '' }}
          READER_V3_PREVIEW_FIRST: ${{ vars.READER_V3_PREVIEW_FIRST || 'false' }}
          READER_V3_DJVU_MIGRATION: ${{ vars.READER_V3_DJVU_MIGRATION || 'false' }}
          READER_DATASET_PRIMARY_ENABLED: ${{ vars.READER_DATASET_PRIMARY_ENABLED || 'false' }}
          OPERATION: ${{ inputs.operation }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          SURFACE: ${{ inputs.surface }}
          APPLY: ${{ inputs.apply }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          READER_PAGES_EXACT_ENABLED: ${{ vars.READER_PAGES_EXACT_ENABLED }}
          READER_WEB_PROFILE_REBUILD_ENABLED: ${{ vars.READER_WEB_PROFILE_REBUILD_ENABLED }}
          READER_WEB_PROFILE_CANDIDATE_INDEX: ${{ vars.READER_WEB_PROFILE_CANDIDATE_INDEX }}
          WEB_PROFILE_AUTOMATION_ID: ${{ inputs.automation_id }}
          READER_WEB_PROFILE_PAGES_SCOPE_REVIEWED: ${{ vars.READER_WEB_PROFILE_PAGES_SCOPE_REVIEWED }}
          READER_PROFILE_PAUSED: ${{ vars.READER_V3_AUTO_PAUSED }}
          READER_WEB_PAGES_PROOF_TOKEN: ${{ ((inputs.operation == 'verify-managed-web' || inputs.operation == 'prepare-managed-web') || ((inputs.operation == 'replace-managed-web' || inputs.operation == 'upgrade-web-profile') && inputs.apply)) && secrets.READER_PAGES_DISPATCH_TOKEN || '' }}
          READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED: ${{ (inputs.operation == 'replace-exact-web' || inputs.operation == 'replace-managed-web' || inputs.operation == 'replace-exact-office-report') && vars.READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED || '' }}
        run: |
          # Old scheduled or queued runs must not resume retirement after the
          # publisher is re-enabled. Manual dispatch is the only live entry.
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            echo "Scheduled v3 retirement is disabled" >&2
            exit 1
          fi
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "apply=$APPLY" >> "$GITHUB_OUTPUT"
          if [[ "$OPERATION" == verify-pages-lane ]]; then
            [[ "$APPLY" == false ]]
            python -B -m scripts.reader_pages_release --preflight
            exit 0
          fi
          if [[ "$OPERATION" == verify-exact-office-report ]]; then
            set -euo pipefail
            [[ "$APPLY" == false && "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
            python -B -m scripts.reader_exact_office_probe
            exit 0
          fi
          if [[ "$OPERATION" == verify-exact-web ]]; then
            set -euo pipefail
            [[ "$APPLY" == false && "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
            python -B -m scripts.reader_mht_s3_preflight
            exit 0
          fi
          if [[ "$OPERATION" == replace-exact-office-report ]]; then
            set -euo pipefail
            [[ "$APPLY" == true && "$READER_PAGES_EXACT_ENABLED" == true && -n "$GC_CENTRAL_TOKEN" ]]
            [[ "$READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED" == true ]]
            [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
            python -B -m scripts.reader_pages_release --preflight
            mkdir -p output/v3
            python -B -m scripts.reader_exact_office_bundle --resource-json "$RESOURCE_JSON" --output output/v3/publication.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == upgrade-web-profile ]]; then
            set -euo pipefail
            [[ "$APPLY" == true && "$GITHUB_RUN_ATTEMPT" == 1 && "$WEB_PROFILE_AUTOMATION_ID" =~ ^[0-9a-f]{32}$ ]]
            [[ "$READER_WEB_PROFILE_REBUILD_ENABLED" == true && "$READER_PAGES_EXACT_ENABLED" == true && "$READER_WEB_PROFILE_PAGES_SCOPE_REVIEWED" == true && "$READER_PROFILE_PAUSED" != true ]]
            python -B -m scripts.reader_pages_release --preflight
            python -B -m scripts.reader_web_profile_publish --resource-json "$RESOURCE_JSON" --output output/v3/publication.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == prepare-managed-web ]]; then
            set -euo pipefail
            [[ "$APPLY" == false && "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
            [[ "$(jq -ce 'keys' <<< "$RESOURCE_JSON")" == '["candidate_sha256"]' ||
               "$(jq -ce 'keys' <<< "$RESOURCE_JSON")" == '["candidate_sha256","hold_admission_sha256"]' ]]
            python -B -m scripts.reader_web_managed_prepare --resource-json "$RESOURCE_JSON" --output output/v3
            exit 0
          fi
          if [[ "$OPERATION" == verify-managed-web || "$OPERATION" == replace-managed-web ]]; then
            set -euo pipefail
            [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
            mkdir -p output/v3
            if [[ "$OPERATION" == verify-managed-web ]]; then
              [[ "$APPLY" == false ]]
              python -B -m scripts.reader_web_batch_cli preflight --managed --resource-json "$RESOURCE_JSON" --output output/v3/web-batch-authority.json
            else
              [[ "$APPLY" == true && "$READER_PAGES_EXACT_ENABLED" == true && "$READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED" == true ]]
              [[ -n "$GC_CENTRAL_TOKEN" ]]
              python -B -m scripts.reader_pages_release --preflight
              python -B -m scripts.reader_web_batch_cli apply --managed --resource-json "$RESOURCE_JSON" --output output/v3/publication.json
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [[ "$OPERATION" == replace-exact-web ]]; then
            set -euo pipefail
            [[ "$APPLY" == true && "$READER_PAGES_EXACT_ENABLED" == true ]]
            [[ -n "$GC_CENTRAL_TOKEN" ]]
            # A repository write role and GET preflight do not prove token
            # Actions:write. Require separate operator review of that grant.
            [[ "$READER_WEB_PAGES_DISPATCH_SCOPE_REVIEWED" == true ]]
            [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" && "$GITHUB_RUN_ATTEMPT" == 1 ]]
            [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
            [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
            python -B -m scripts.reader_pages_release --preflight
            mkdir -p output/v3
            python -B -m scripts.reader_web_exact_bundle --resource-json "$RESOURCE_JSON" --output output/v3/publication.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$RESOURCE_JSON" ]]; then RESOURCE_JSON='{}'; fi
          args=("$OPERATION" --output output/v3/publication.json)
          case "$OPERATION" in
            withdraw|remove-route|restore-route|verify-route) args+=(--resource-json "$RESOURCE_JSON" --expected-parent "$EXPECTED_PARENT") ;;
            migrate-derived|resume-derived|redirect-derived|finalize-derived-redirects|replace-derived-history|refresh-reader-consumers|reconcile-derived-index|reconcile-sidecar|compact-legacy-history) args+=(--resource-json "$RESOURCE_JSON") ;;
            publish-generation|verify-generation) args+=(--expected-parent "$EXPECTED_PARENT" --wait-seconds 1200) ;;
            unify|reset-documents) args+=(--resource-json "$RESOURCE_JSON") ;;
            retire) ;;
            ack) args+=(--surface "$SURFACE") ;;
            inspect) ;;
            *) exit 1 ;;
          esac
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          if [[ "$APPLY" == true && "$READER_PAGES_EXACT_ENABLED" == true && ( "$OPERATION" == unify || "$OPERATION" == publish-generation ) ]]; then
            python -B -m scripts.reader_pages_release --preflight
          fi
          python scripts/publish_reader_v3.py "${args[@]}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "redirect_audited=$(jq -r '.redirect_audited // false' output/v3/publication.json)" >> "$GITHUB_OUTPUT"
      - name: Publish and verify exact web consumer projections
        if: steps.operation.outputs.changed == 'true' && inputs.operation == 'replace-exact-web'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_PAGES_DISPATCH_TOKEN: ${{ secrets.READER_PAGES_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -m scripts.reader_pages_release --publication output/v3/publication.json --output output/v3/pages-release.json
          generation=$(jq -er '.generation' output/v3/publication.json)
          python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
            --wait-seconds 1200 --output output/v3/web-verification.json
          python -B -m scripts.reader_web_exact_live --publication output/v3/publication.json \
            --consumers output/v3/web-verification.json --output output/v3/web-object-readback.json
      - name: Publish and verify managed web consumer projections
        if: steps.operation.outputs.changed == 'true' && inputs.operation == 'replace-managed-web'
        env:
          RESOURCE_JSON: ${{ inputs.resource_json }}
          GC_CENTRAL_TOKEN: ${{ github.token }}
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_PAGES_DISPATCH_TOKEN: ${{ secrets.READER_PAGES_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -m scripts.reader_pages_release --publication output/v3/publication.json --output output/v3/pages-release.json
          generation=$(jq -er '.generation' output/v3/publication.json)
          python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
            --wait-seconds 1200 --output output/v3/web-verification.json
          review=$(jq -ce '{bundle_sha256,review_sha256}' <<< "$RESOURCE_JSON")
          python -B -m scripts.reader_web_batch_cli live --managed --resource-json "$review" \
            --publication output/v3/publication.json --consumers output/v3/web-verification.json \
            --output output/v3/web-batch-object-readback.json --hold-cleanup output/v3/web-hold-cleanup.json
      - name: Publish and verify automatic web profile on both sites
        if: steps.operation.outputs.changed == 'true' && inputs.operation == 'upgrade-web-profile'
        env:
          RESOURCE_JSON: ${{ inputs.resource_json }}
          WEB_PROFILE_AUTOMATION_ID: ${{ inputs.automation_id }}
          READER_WEB_PROFILE_REBUILD_ENABLED: ${{ vars.READER_WEB_PROFILE_REBUILD_ENABLED }}
          READER_WEB_PROFILE_PAGES_SCOPE_REVIEWED: ${{ vars.READER_WEB_PROFILE_PAGES_SCOPE_REVIEWED }}
          READER_PROFILE_PAUSED: ${{ vars.READER_V3_AUTO_PAUSED }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_PAGES_DISPATCH_TOKEN: ${{ secrets.READER_PAGES_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$(jq -er '.changed_rows' output/v3/publication.json)" != 0 ]]; then
            python -B -m scripts.reader_pages_release --publication output/v3/publication.json --output output/v3/pages-release.json
          fi
          generation=$(jq -er '.generation' output/v3/publication.json)
          python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
            --wait-seconds 1200 --output output/v3/format-automation-verification.json
          python -B -m scripts.reader_web_profile_readback --publication output/v3/publication.json \
            --consumers output/v3/format-automation-verification.json --resource-json "$RESOURCE_JSON" \
            --output output/v3/web-profile-readback.json
      - name: Publish and verify exact Office consumer projections
        if: steps.operation.outputs.changed == 'true' && inputs.operation == 'replace-exact-office-report'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_PAGES_DISPATCH_TOKEN: ${{ secrets.READER_PAGES_DISPATCH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B -m scripts.reader_pages_release --publication output/v3/publication.json --output output/v3/pages-release.json
          generation=$(jq -er '.generation' output/v3/publication.json)
          python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
            --wait-seconds 1200 --output output/v3/office-verification.json
      - name: Publish the pinned projection to Pages
        if: >-
          steps.operation.outputs.apply == 'true' &&
          steps.operation.outputs.changed == 'true' &&
          contains(fromJSON('["withdraw","unify","reset-documents","remove-route","restore-route","migrate-derived","resume-derived","redirect-derived","finalize-derived-redirects","publish-generation"]'), steps.operation.outputs.operation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
          PAGES_REPO: ${{ secrets.PAGES_REPO }}
          READER_PAGES_DISPATCH_TOKEN: ${{ vars.READER_PAGES_EXACT_ENABLED == 'true' && inputs.apply && contains(fromJSON('["unify","publish-generation"]'), inputs.operation) && secrets.READER_PAGES_DISPATCH_TOKEN || '' }}
          GH_TOKEN: ${{ github.token }}
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          READER_PAGES_EXACT_ENABLED: ${{ vars.READER_PAGES_EXACT_ENABLED }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: |
          if [[ "$OPERATION" == publish-generation ]]; then
            actual=$(python scripts/publish_reader_v3.py inspect | jq -r '.pointer.generation')
            [[ "$actual" == "$EXPECTED_PARENT" ]] || { echo 'generation changed before Pages publication' >&2; exit 1; }
          fi
          if [[ "$OPERATION" == migrate-derived || "$OPERATION" == resume-derived ]]; then
            python scripts/publish_reader_v3.py check-page-window --resource-json "$RESOURCE_JSON"
          fi
          if [[ "$READER_PAGES_EXACT_ENABLED" == true && ( "$OPERATION" == unify || "$OPERATION" == publish-generation ) ]]; then
            python -B -m scripts.reader_pages_release --publication output/v3/publication.json --output output/v3/pages-release.json
          else
            python scripts/publish_search_reader_index.py --pinned-only
          fi
      - name: Confirm both deployed consumer projections
        id: ack
        if: >-
          steps.operation.outputs.apply == 'true' &&
          steps.operation.outputs.changed == 'true' &&
          contains(fromJSON('["withdraw","unify","reset-documents","remove-route","restore-route","migrate-derived","resume-derived","redirect-derived","finalize-derived-redirects","publish-generation"]'), steps.operation.outputs.operation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          OPERATION: ${{ steps.operation.outputs.operation }}
          RESOURCE_JSON: ${{ inputs.resource_json }}
          EXPECTED_PARENT: ${{ inputs.expected_parent }}
          REDIRECT_AUDITED: ${{ steps.operation.outputs.redirect_audited }}
          AUTOMATION_ID: ${{ inputs.automation_id }}
        run: |
          if [[ "$OPERATION" == finalize-derived-redirects ]]; then
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
              --wait-seconds 1200 --output output/v3/finalization-verification.json
            python scripts/publish_reader_v3.py ack-all --expected-parent "$generation" --apply --output output/v3/consumers.json
            [[ "$(jq -r '.complete // false' output/v3/consumers.json)" == true ]]
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$AUTOMATION_ID" ]]; then
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
              --wait-seconds 1200 --output output/v3/format-automation-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == unify && "$REDIRECT_AUDITED" == true ]]; then
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
              --wait-seconds 1200 --output output/v3/migration-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == publish-generation ]]; then
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$EXPECTED_PARENT" \
              --wait-seconds 1200 --output output/v3/migration-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == migrate-derived || "$OPERATION" == resume-derived || "$OPERATION" == redirect-derived ]]; then
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
              --wait-seconds 1200 --output output/v3/migration-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$OPERATION" == remove-route || "$OPERATION" == restore-route ]]; then
            # Verify the deployed projection without writing GC acknowledgments.
            generation=$(jq -r '.generation' output/v3/publication.json)
            python scripts/publish_reader_v3.py verify-route --resource-json "$RESOURCE_JSON" \
              --expected-parent "$generation" --route-action "$OPERATION" --wait-seconds 1200 \
              --output output/v3/route-verification.json
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/publish_reader_v3.py ack-all --apply --output output/v3/consumers.json
          echo "complete=$(jq -r '.complete // false' output/v3/consumers.json)" >> "$GITHUB_OUTPUT"
          # Record the base-catalog generation both deployments just confirmed.
          # The GC collector needs this to compact history; it never relied on
          # acknowledgments inside the 2 GB canonical catalog itself.
          if [[ "$(jq -r '.complete // false' output/v3/consumers.json)" == "true" ]]; then
            python scripts/publish_reader_v3.py acknowledge-legacy --apply \
              --output output/v3/acknowledgments.json
            ack_reason=$(jq -r '.reason // "recorded"' output/v3/acknowledgments.json)
            if [[ "$ack_reason" == "recorded" ]]; then
              # Shrink the base catalog in the ordinary publish path. The 2 GB
              # object would otherwise need a drained window just to stay bounded.
              python scripts/publish_reader_v3.py compact-legacy --apply \
                --output output/v3/catalog-compaction.json
              # The compaction rewrites the catalog, so refresh the receipt that
              # names its digest for the GC collector.
              python scripts/publish_reader_v3.py acknowledge-legacy --apply \
                --output output/v3/acknowledgments.json
            else
              echo "base acknowledgment deferred: $ack_reason"
            fi
          else
            echo "consumer projections are incomplete; base acknowledgment deferred"
          fi
      - name: Verify both consumers after PDF index reconciliation
        if: steps.operation.outputs.apply == 'true' && contains(fromJSON('["reconcile-derived-index","reconcile-sidecar","compact-legacy-history"]'), steps.operation.outputs.operation)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          generation=$(jq -r '.generation' output/v3/publication.json)
          python scripts/publish_reader_v3.py verify-generation --expected-parent "$generation" \
            --wait-seconds 1200 --output output/v3/reconciliation-verification.json
      - uses: actions/upload-artifact@v7
        if: always() && inputs.operation == 'upgrade-web-profile'
        with:
          name: web-profile-recovery-input
          path: |
            output/v3/web-profile-review.zip
            output/v3/web-profile-replay.json
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v3-publication-report
          path: |
            output/v3/*.json
            output/v3/managed-review.zip
            output/mht-s3-preflight.json
            output/office-s3-preflight.json
          retention-days: 30
          if-no-files-found: warn
