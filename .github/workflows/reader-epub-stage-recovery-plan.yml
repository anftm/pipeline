name: Reader/桶 · Plan EPUB Staging Recovery
run-name: EPUB staging recovery inventory / ${{ inputs.operation }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact interrupted 32-hex EPUB staging operation
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: reader-backlog-inspection
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Exercise recovery inventory contracts
        run: python -B -m unittest -v tests.test_reader_epub_stage_recovery_plan
      - name: Observe missing protection and immutable objects
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ "$OPERATION" =~ ^[0-9a-f]{32}$ ]] || exit 1
          python -B scripts/reader_epub_stage_recovery_plan.py --operation "$OPERATION" \
            --output output/epub-stage-recovery.json
      - name: Preserve read-only recovery inventory
        uses: actions/upload-artifact@v7
        with:
          name: reader-epub-stage-recovery-plan
          path: output/epub-stage-recovery.json
          if-no-files-found: error
          retention-days: 30
