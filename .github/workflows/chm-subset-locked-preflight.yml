name: CHM subset locked preflight (read only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PREFLIGHT-352 for a read-only inspection
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'PREFLIGHT-352'
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/chm-subset-locked-preflight-inner.yml
    secrets: inherit
