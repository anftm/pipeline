name: Revert proofreading

on:
  workflow_dispatch:
    inputs:
      correction_id:
        description: Correction ID from the auto-merge notification
        required: true
        type: string
      confirm:
        description: Type REVERT to confirm
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revert:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && contains(github.event.issue.body, '<!-- proofreading-auto-merge-log -->') && contains(github.event.comment.body, '/proofread-revert'))
    runs-on: ubuntu-latest
    concurrency:
      group: proofreading-revert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Create human-reviewed revert PRs
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TRACKER_TOKEN: ${{ github.token }}
          PROOFREAD_CORRECTION_ID: ${{ inputs.correction_id }}
          PROOFREAD_CONFIRM: ${{ inputs.confirm }}
          PROOFREAD_REVERT_ACTORS: ${{ vars.PROOFREAD_REVERT_ACTORS }}
        run: python3 scripts/revert_proofread.py
