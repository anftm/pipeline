name: BHA · Inspect Source Mirror

on:
  # Read-only coverage report. The old optimize operation rewrites content in
  # place; neither it nor uploads are resumed by enabling this workflow.
  workflow_dispatch:
    inputs:
      archive_id:
        description: One upstream archive number from 0 through 31
        type: string
        default: '0'
        required: true

permissions:
  contents: read

concurrency:
  group: mirror-bha-source-files
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Compare pinned source metadata and mirror manifest
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_ID: ${{ inputs.archive_id }}
        run: |
          [[ "$ARCHIVE_ID" =~ ^([0-9]|[12][0-9]|3[01])$ ]] || exit 1
          python scripts/inspect_bha_source_mirror.py --archive "$ARCHIVE_ID" --output output/bha/source-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: bha-source-mirror-report
          path: output/bha/source-report.json
          retention-days: 30
          if-no-files-found: error
