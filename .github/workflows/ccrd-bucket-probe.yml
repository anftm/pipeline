name: CCRD · Verify Bucket Conditions
run-name: CCRD bucket conditional probe / ${{ inputs.apply && 'one test key' || 'dry run' }}

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Create and conditionally delete exactly one random test object
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  probe:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install exact bucket probe dependencies
        run: python -m pip install boto3==1.43.123 huggingface_hub==1.33.0 hf-xet==1.8.0 PyYAML==6.0.3
      - name: Exercise bounded probe safety contracts
        run: python -B -m unittest -v tests.test_ccrd_bucket_probe
      - name: Run one explicitly bounded probe
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          if [[ "$APPLY" == 'true' ]]; then
            python -B scripts/ccrd_bucket_probe.py --apply
          else
            python -B scripts/ccrd_bucket_probe.py
          fi
