name: CHM final exact 20 EPUB retirement
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RETIRE-FINAL-20 to remove the final fixed EPUBs
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max
jobs:
  retire:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'RETIRE-FINAL-20'
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/chm-final20-execute-inner.yml
    secrets: inherit
