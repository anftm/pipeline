name: Reader · Verify retired producer credentials

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VERIFY-PRODUCER-CREDENTIALS for GET-only checks
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'VERIFY-PRODUCER-CREDENTIALS'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install httpx==0.28.1
      - name: Test read-only checks
        run: python -B -m unittest tests.test_reader_producer_v2_names tests.test_reader_producer_v2_credentials_preflight -q
      - name: Check central and retired-owner identities
        env:
          GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
          GC_AMBROSSEE_MAINTENANCE_TOKEN: ${{ secrets.GC_AMBROSSEE_MAINTENANCE_20261102 }}
        run: python -u -B scripts/reader_producer_v2_credentials_preflight.py
