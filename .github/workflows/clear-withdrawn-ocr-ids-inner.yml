name: Clear withdrawn OCR ID mappings inner
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  clear:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'CLEAR-WITHDRAWN-OCR-IDS'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    env:
      HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
      HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
      HF_S3_INPUT_ACCESS_KEY_ID: ${{ secrets.HF_S3_INPUT_ACCESS_KEY_ID }}
      HF_S3_INPUT_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_INPUT_SECRET_ACCESS_KEY }}
      GC_PRODUCER_TOKENS_JSON: ${{ secrets.GC_PRODUCER_TOKENS_JSON }}
      GH_TOKEN: ${{ secrets.PDF_WORKER_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Test exact withdrawn ID cleanup and recovery
        run: python -B -m unittest tests.test_clear_withdrawn_ocr_ids tests.test_ccrd_ocr_exact_retirement tests.test_reader_gc_fence -q
      - name: Clear only withdrawn OCR ID mappings
        run: python -u -B scripts/clear_withdrawn_ocr_ids.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: withdrawn-ocr-id-cleanup
          path: output/clear-withdrawn-ocr-ids/*
          retention-days: 90
          if-no-files-found: warn
