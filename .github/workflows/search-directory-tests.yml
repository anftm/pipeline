name: 搜索 · Directory Sync Tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/search-directory-tests.yml
      - .github/workflows/search-daily-sync.yml
      - .github/workflows/search-update-directories.yml
      - scripts/fetch_and_parse.py
      - scripts/sync_to_space.py
      - scripts/sync_to_pages.py
      - scripts/text_encoding.py
      - scripts/publish_source_txt_once.py
      - scripts/mul.py
      - scripts/update_dirs.py
      - tests/test_fetch_and_parse.py
      - tests/test_search_directory_sync.py
      - tests/test_sync_auth.py
      - tests/test_text_encoding_retirement.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install search dependency
        run: python -m pip install jieba==0.42.1
      - name: Exercise local Git and LFS, concurrency and source snapshots
        run: python -B -m unittest tests.test_search_directory_sync tests.test_fetch_and_parse tests.test_sync_auth tests.test_text_encoding_retirement -v
