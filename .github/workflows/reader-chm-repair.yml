name: Reader/桶 · Rebuild CHM Chapter Streams
run-name: CHM source-text repair / ${{ (github.event_name == 'schedule' || inputs.apply == true) && 'apply' || 'plan' }}

on:
  schedule:
    # Drain the CHM backlog automatically; one 100-source batch per day.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum stale CHM sources in this batch (1-100)
        required: true
        default: "100"
        type: string
      apply:
        description: Convert and publish; false only reports the pending queue
        required: true
        default: false
        type: boolean
      retry_failed:
        description: Explicitly retry sources that failed the v9 conversion
        required: true
        default: false
        type: boolean
      failed_only:
        description: Retry only the previous failure checkpoint, not the old-profile queue
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  plan:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch pinned CHM source metadata
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan only sources on the old CHM chapter profile
        id: plan
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          LIMIT: ${{ inputs.limit || '100' }}
          RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
          FAILED_ONLY: ${{ inputs.failed_only || 'false' }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && ((10#$LIMIT >= 1 && 10#$LIMIT <= 100)) || exit 1
          args=(--extension chm --limit "$LIMIT" --shard-count 1 --shard-index 0 --plan-only)
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failures); fi
          if [[ "$FAILED_ONLY" == "true" ]]; then args+=(--failed-only); fi
          report=$(python scripts/pilot_epub_chapters.py "${args[@]}")
          echo "$report"
          mkdir -p output
          printf '%s\n' "$report" > output/chm-plan.json
          count=$(python -c 'import json,sys; print(json.loads(sys.argv[1])["selected"])' "$report")
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Preserve the pinned source snapshot for the conversion run
        run: tar -czf output/chm-source-snapshot.tgz output/search_data.json state/commits.json output/chm-plan.json
      - uses: actions/upload-artifact@v7
        with:
          name: chm-source-snapshot
          path: output/chm-source-snapshot.tgz
          retention-days: 1
          if-no-files-found: error

  rebuild:
    needs: plan
    if: (github.event_name == 'schedule' || inputs.apply == true) && needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends calibre p7zip-full
      - uses: actions/download-artifact@v8
        with:
          name: chm-source-snapshot
          path: output
      - run: tar -xzf output/chm-source-snapshot.tgz
      - name: Build chapter streams from pinned CHMs (EPUB is temporary)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          READER_CHM_COMMAND_TIMEOUT: "1800"
          READER_CONVERSION_WORKERS: "2"
          LIMIT: ${{ inputs.limit || '100' }}
          RETRY_FAILED: ${{ inputs.retry_failed || 'false' }}
          FAILED_ONLY: ${{ inputs.failed_only || 'false' }}
        run: |
          args=(--extension chm --limit "$LIMIT" --shard-count 1 --shard-index 0 --apply --workers 2 --strict)
          if [[ "$RETRY_FAILED" == "true" ]]; then args+=(--retry-failures); fi
          if [[ "$FAILED_ONLY" == "true" ]]; then args+=(--failed-only); fi
          python scripts/pilot_epub_chapters.py "${args[@]}"
      - name: Rebuild the canonical Reader sidecar and release handed-off roots
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify the updated Reader projection
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f operation=unify -f apply=true
