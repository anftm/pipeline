name: CCRD · Build and Stage Four-Source Update

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: pip install -r scripts/requirements.txt PyYAML==6.0.3
      - name: Test source, staging and recovery contracts
        run: |
          python -B -m unittest -v tests.test_ccrd_auto_stage tests.test_ccrd_local_candidate \
            tests.test_ccrd_stage_objects tests.test_ccrd_stage_manifest tests.test_ccrd_publication_end_to_end
      - name: Compare upstream text and actual four-source consumer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B scripts/check_ccrd_four_source.py --output "$RUNNER_TEMP/ccrd-four-source-check.json"
      - name: Build and stage only if the upstream source changed
        id: stage
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          python -B scripts/ccrd_auto_stage.py --stage --work "$RUNNER_TEMP/ccrd-stage" \
            --report "$RUNNER_TEMP/ccrd-stage-report.json"
      - name: Preserve exact staged candidate for recovery
        if: steps.stage.outputs.status == 'staged'
        uses: actions/upload-artifact@v7
        with:
          name: ccrd-staged-candidate
          path: ${{ runner.temp }}/ccrd-stage/bundle/
          retention-days: 30
          if-no-files-found: error
      - name: Preserve stage report
        uses: actions/upload-artifact@v7
        with:
          name: ccrd-four-source-stage-report
          path: |
            ${{ runner.temp }}/ccrd-stage-report.json
            ${{ runner.temp }}/ccrd-four-source-check.json
          retention-days: 30
          if-no-files-found: error
