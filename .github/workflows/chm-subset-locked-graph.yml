name: CHM subset locked graph (read only)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type GRAPH-352 for a read-only graph inspection
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-ccrd-index
  cancel-in-progress: false
  queue: max

jobs:
  inspect:
    if: github.repository == 'anftm/pipeline' && github.ref == 'refs/heads/main' && inputs.confirm == 'GRAPH-352'
    concurrency:
      group: reader-global-maintenance
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/chm-subset-locked-graph-inner.yml
    secrets: inherit
