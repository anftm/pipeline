name: 运维 · Maintenance Watch

on:
  schedule:
    # 01:17 UTC: after the nightly search sync window; schedules may be delayed.
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      force_email:
        description: Send an email even when nothing changed
        type: boolean
        default: false
      dry_run:
        description: Print the email without sending or updating state
        type: boolean
        default: false
      ack:
        description: "Comma-separated manual check names to confirm; use all"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: maintenance-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_EMAIL: ${{ inputs.force_email || false }}
      DRY_RUN: ${{ inputs.dry_run || false }}
      ACK: ${{ inputs.ack || '' }}
    steps:
      - name: Checkout pipeline
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Verify maintenance watch contracts offline
        run: python -B -m unittest tests.test_maintenance_watch -v

      - name: Check dependencies and upstream datasets
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_SUBJECT_PREFIX: ${{ secrets.MAIL_SUBJECT_PREFIX }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          BAIDU_UPSTREAM_1_URL: ${{ secrets.BAIDU_UPSTREAM_1_URL }}
          BAIDU_UPSTREAM_2_URL: ${{ secrets.BAIDU_UPSTREAM_2_URL }}
        run: |
          set --
          if [ "${FORCE_EMAIL}" = "true" ]; then set -- "$@" --force-email; fi
          if [ "${DRY_RUN}" = "true" ]; then set -- "$@" --dry-run; fi
          if [ -n "${ACK}" ]; then set -- "$@" --ack "${ACK}"; fi
          python -B scripts/maintenance_watch.py \
            --config scripts/maintenance-watch.json \
            --state state/maintenance-watch.json "$@"

      - name: Commit maintenance state
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/maintenance-watch.json
          if git diff --staged --quiet; then
            echo "No maintenance state changes to commit"
            exit 0
          fi
          git commit -m "chore: update maintenance watch state [skip ci]"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "State push raced; rebasing (attempt $((attempt + 1))/3)" >&2
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Unable to rebase maintenance state" >&2
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "Unable to publish maintenance state after retries" >&2
          exit 1
