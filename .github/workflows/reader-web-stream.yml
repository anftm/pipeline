name: Reader/桶 · Build Web Streams
run-name: Web streams ${{ (github.event_name == 'schedule' || inputs.apply == true) && 'apply' || 'plan' }} (${{ inputs.extension || 'all' }})

on:
  schedule:
    # HTML-family sources change slowly; run after the weekly text pass.
    - cron: "7 3 * * 1"
  workflow_dispatch:
    inputs:
      extension:
        description: Web format, or all
        required: true
        default: all
        type: choice
        options: [all, html, htm, mht, mhtml]
      limit:
        description: Maximum sources; 0 means all pending
        required: true
        default: "0"
        type: string
      apply:
        description: Convert and publish web streams
        required: true
        default: false
        type: boolean
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-web
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan pending web workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          args=(--kind web --extension "${{ inputs.extension || 'all' }}" --output output/web-matrix.json --report output/web-report.json)
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.retry_failures }}" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/web-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/web-plan.tgz output/search_data.json state/commits.json output/web-matrix.json output/web-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-web-plan
          path: output/web-plan.tgz
          retention-days: 1

  web-stream:
    needs: plan
    if: >-
      (github.event_name == 'schedule' || inputs.apply == true) &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reader-web-plan
          path: output
      - run: tar -xzf output/web-plan.tgz
      - name: Build and publish web streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: |
          [[ "${{ inputs.limit || '0' }}" =~ ^[0-9]+$ ]] || exit 1
          args=(--extension "${{ matrix.extension }}" --limit "${{ inputs.limit || '0' }}" --apply --strict)
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.retry_failures }}" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_web_stream.py "${args[@]}"

  finalize:
    needs: [plan, web-stream]
    if: >-
      always() && needs.plan.result == 'success' &&
      (github.event_name == 'schedule' || inputs.apply == true) &&
      needs.web-stream.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
