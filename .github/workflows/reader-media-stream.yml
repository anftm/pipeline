name: Reader/桶 · Build Media Streams
run-name: Media streams ${{ inputs.apply == true && 'apply' || 'plan' }} (${{ inputs.kind || 'all' }})

on:
  # Resume by reviewed manual batches; do not restart the unlimited daily run.
  workflow_dispatch:
    inputs:
      kind:
        description: Media kind, or all
        required: true
        default: all
        type: choice
        options: [all, audio, video, swf]
      limit:
        description: Maximum attempts per shard; apply requires 1-3, plan allows 0
        required: true
        default: "1"
        type: string
      apply:
        description: Convert and publish media streams
        required: true
        default: false
        type: boolean
      retry_failures:
        description: Retry previously recorded failures
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: reader-media
  cancel-in-progress: false
  queue: max

jobs:
  codecs:
    if: inputs.apply == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - run: python scripts/verify_reader_media_codecs.py --output output/media-codecs.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-media-codecs
          path: output/media-codecs.json
          retention-days: 14

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Fetch source metadata once
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FORCE_SYNC: "true"
          SKIP_SIZES: "true"
        run: python scripts/fetch_and_parse.py
      - name: Plan pending media workers
        id: matrix
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          KIND: ${{ inputs.kind || 'all' }}
          LIMIT: ${{ inputs.limit || '1' }}
          APPLY: ${{ inputs.apply }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo 'limit must be non-negative' >&2; exit 1; }
          if [[ "$APPLY" == 'true' && ! "$LIMIT" =~ ^[1-3]$ ]]; then
            echo 'apply requires 1-3 attempts per shard' >&2; exit 1
          fi
          args=(--kind media --extension "$KIND" --output output/media-matrix.json --verify-source-sha --report output/media-report.json)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/plan_reader_stream_matrix.py "${args[@]}"
          echo "matrix=$(cat output/media-matrix.json)" >> "$GITHUB_OUTPUT"
      - run: tar -czf output/media-plan.tgz output/search_data.json state/commits.json output/media-matrix.json output/media-report.json
      - uses: actions/upload-artifact@v7
        with:
          name: reader-media-plan
          path: output/media-plan.tgz
          retention-days: 1

  media:
    needs: plan
    if: >-
      inputs.apply == true &&
      fromJSON(needs.plan.outputs.matrix).include[0] != null
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    # Sharded uploads and checkpoints must not race the canonical handoff.
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: |
          pip install -r scripts/requirements.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: reader-media-plan
          path: output
      - run: tar -xzf output/media-plan.tgz
      - name: Build and publish media streams
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          KIND: ${{ matrix.extension }}
          SHARD: ${{ matrix.shard }}
          LIMIT: ${{ inputs.limit || '1' }}
          RETRY_FAILURES: ${{ inputs.retry_failures }}
        run: |
          [[ "$LIMIT" =~ ^[1-3]$ ]] || { echo 'apply requires 1-3 attempts per shard' >&2; exit 1; }
          [[ "$SHARD" =~ ^[0-7]$ ]] || exit 1
          args=(--kind "$KIND" --limit "$LIMIT"
                --shard-count 8 --shard-index "$SHARD" --apply --strict)
          if [[ "$RETRY_FAILURES" == "true" ]]; then args+=(--retry-failures); fi
          python scripts/pilot_media_stream.py "${args[@]}"

  finalize:
    needs: [plan, media, codecs]
    if: >-
      always() && needs.plan.result == 'success' &&
      needs.codecs.result == 'success' &&
      inputs.apply == true && needs.media.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r scripts/requirements.txt
      - name: Merge canonical media indexes
        env:
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          HF_S3_BUCKET: vomebook/reader-assets-v2
        run: python scripts/finalize_media_indexes.py
      - name: Rebuild canonical Reader sidecar
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
        run: python scripts/build_reader_assets_v2_sidecar.py --apply
      - name: Unify sidecar through the central v3 writer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run reader-v3-publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f operation=unify -f apply=true
          echo "central v3 unify dispatched; current reader-sidecar lock will be released when this producer exits"
