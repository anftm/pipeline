name: BHA · Collect Retired Snapshots
on:
  schedule:
    - cron: '29 11 * * *'
  workflow_dispatch:
    inputs:
      apply:
        type: boolean
        default: false
        description: Mark or collect at most one old unreferenced generation
permissions:
  contents: read
concurrency:
  group: update-bha-index
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    if: github.repository == 'anftm/pipeline' && (github.event_name == 'workflow_dispatch' || vars.BHA_GC_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -B -m unittest -v tests.test_bha_snapshot_gc
      - name: Preserve current, rollback and referenced snapshots before bounded collection
        env:
          BHA_REINDEX_TOKEN: ${{ secrets.BHA_REINDEX_TOKEN }}
          HF_S3_ACCESS_KEY_ID: ${{ secrets.HF_S3_ACCESS_KEY_ID }}
          HF_S3_SECRET_ACCESS_KEY: ${{ secrets.HF_S3_SECRET_ACCESS_KEY }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
        run: |
          set -euo pipefail
          args=(--output output/bha-snapshot-gc.json)
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python -B -m scripts.bha_snapshot_gc "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bha-snapshot-gc
          path: output/bha-snapshot-gc.json
          retention-days: 30
          if-no-files-found: warn
