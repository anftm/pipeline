name: 搜索 · Directory Sync Tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/search-directory-tests.yml
      - .github/workflows/search-daily-sync.yml
      - .github/workflows/search-bucket-gc.yml
      - .github/workflows/search-bucket-probe.yml
      - scripts/search_daily_publish.py
      - scripts/search_gc.py
      - scripts/search_gc_s3.py
      - scripts/fetch_and_parse.py
      - scripts/search_daily_journal.py
      - scripts/search_transition.py
      - scripts/search_publication_pointer.py
      - scripts/sync_to_space.py
      - scripts/sync_to_pages.py
      - scripts/text_encoding.py
      - scripts/mul.py
      - scripts/update_dirs.py
      - tests/test_fetch_and_parse.py
      - tests/test_search_daily_journal.py
      - tests/test_search_directory_sync.py
      - tests/test_search_automation_workflows.py
      - tests/test_search_daily_publish.py
      - tests/test_search_gc.py
      - tests/test_search_gc_s3.py
      - scripts/search_gc_roots.py
      - tests/test_search_gc_roots.py
      - .github/workflows/search-daily-resume.yml
      - tests/test_search_daily_resume_workflow.py
      - scripts/reader_format_daily.py
      - scripts/reader_format_backlog.py
      - scripts/reader_threshold_autobuild.py
      - tests/test_reader_format_daily.py
      - tests/test_reader_format_daily_workflow.py
      - tests/test_reader_format_workflow_automation.py
      - .github/workflows/reader-format-daily.yml
      - .github/workflows/reader-*-stream.yml
      - .github/workflows/reader-office-chapters.yml
      - .github/workflows/reader-chm-repair.yml
      - .github/workflows/reader-v3-publish.yml
      - tests/test_sync_auth.py
      - tests/test_text_encoding_retirement.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install search and workflow-test dependencies
        run: python -m pip install jieba==0.42.1 PyYAML==6.0.3 requests==2.32.5 boto3==1.43.123 huggingface_hub==1.33.0
      - name: Exercise local Git and LFS, concurrency and source snapshots
        run: python -B -m unittest tests.test_search_directory_sync tests.test_fetch_and_parse tests.test_sync_auth tests.test_text_encoding_retirement tests.test_search_daily_journal tests.test_search_automation_workflows tests.test_search_daily_publish tests.test_search_gc tests.test_search_gc_s3 tests.test_search_gc_roots tests.test_search_daily_resume_workflow tests.test_reader_format_daily tests.test_reader_format_daily_workflow tests.test_reader_format_workflow_automation -v
