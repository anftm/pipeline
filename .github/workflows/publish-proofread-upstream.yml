name: Publish proofreading upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Establish a baseline without publishing existing merged corrections
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: publish-proofread-upstream
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Publish merged proofreading corrections
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          PROOFREAD_BOOTSTRAP: ${{ inputs.bootstrap || 'false' }}
          PROOFREAD_TARGET_REPOSITORY: ${{ github.repository }}
          PROOFREAD_TARGET_BASE_BRANCH: main
        run: python3 scripts/publish_proofread_upstream.py
      - name: Commit publishing state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add state/proofread-upstream.json
          git diff --cached --quiet && exit 0
          git commit -m "Track published proofreading batches"
          git push
