name: Force OCR exact book
run-name: Approved PS OCR / ${{ inputs.source_sha256 }} / ${{ inputs.apply && 'apply' || 'verify' }}

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: Approved source repository
        required: true
        default: VoiceOfML/MLMRL-Library
        type: string
      source_path:
        description: Exact approved PS source path
        required: true
        type: string
      source_sha256:
        description: Approved SHA-256 of the published PDF
        required: true
        type: string
      ocr_language:
        description: Approved page language
        default: auto
        type: choice
        options: [auto, ch, en]
      apply:
        description: Prepare immutable OCR objects and serialize their publication
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: force-ocr-${{ inputs.source_sha256 }}
  cancel-in-progress: false
  queue: max

env:
  PDF_OCR_LANG: auto
  PDF_OCR_BACKEND: rapidocr_onnxruntime
  SOURCE_REPO: ${{ inputs.source_repo }}
  SOURCE_PATH: ${{ inputs.source_path }}
  SOURCE_SHA256: ${{ inputs.source_sha256 }}
  OCR_LANGUAGE: ${{ inputs.ocr_language }}

jobs:
  prepare:
    if: github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install render and OCR dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils poppler-data fonts-noto-cjk fonts-liberation
          pip install -r scripts/requirements.txt -r scripts/requirements-pdf-ocr.txt
      - name: Prepare protected immutable objects only
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=(--mode prepare --source-repo "$SOURCE_REPO" --source-path "$SOURCE_PATH"
                --expected-sha256 "$SOURCE_SHA256" --ocr-language "$OCR_LANGUAGE")
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python scripts/force_ocr_book.py "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: approved-ps-ocr
          path: output/force-ocr/result.json
          retention-days: 14
          if-no-files-found: warn

  publish:
    needs: prepare
    if: inputs.apply && github.repository == 'anftm/pipeline'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    concurrency:
      group: reader-sidecar
      cancel-in-progress: false
      queue: max
    env:
      FORCE_OCR_PUBLICATION_PROTOCOL: explicit-ps-ocr-v1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: approved-ps-ocr
          path: output/force-ocr
      - name: Verify and publish only the approved OCR entry under the writer lock
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_INPUT_TOKEN: ${{ secrets.HF_INPUT_TOKEN }}
        run: |
          python scripts/force_ocr_book.py --mode publish --apply \
            --source-repo "$SOURCE_REPO" --source-path "$SOURCE_PATH" \
            --expected-sha256 "$SOURCE_SHA256" --ocr-language "$OCR_LANGUAGE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: approved-ps-ocr-publication
          path: output/force-ocr/publication.json
          retention-days: 14
          if-no-files-found: warn
